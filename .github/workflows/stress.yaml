name: stress

# The stress suite (stress/README.md): hard-to-build CRAN/Bioconductor
# packages compiled from source with r-zig's toolchain, one report per
# OS x distribution. A diagnostic, never a gate: manual dispatch only, no
# push or pull_request trigger, and a failing package does not fail the
# job (stress.R exits 0 unless --strict). The job fails when the harness
# itself breaks: the R build, the toolchain groups, the conda packages,
# an env that cannot be made (stress.R exits 2 and still writes its
# report).
on:
  workflow_dispatch:
    inputs:
      oses:
        description: 'JSON list of runners, one per OS/arch (the toolchain artifact is named by runner.os and runner.arch): ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm'
        type: string
        default: '["ubuntu-latest"]'
      packages:
        description: 'stress/packages.tsv targets: package names, package:variant, groups g0 to g4, tags (heavy, local), or all'
        type: string
        default: 'g0 g3 g4'
      skip:
        description: 'rows, groups or tags to leave out, comma-separated (heavy: the longest builds)'
        type: string
        default: ''
      # b13-leftovers (CI5): the R the tree legs build and run
      variant:
        description: 'tree legs: the R variant built and run: slim (pixi env default), full or openblas (their pixi envs; compile tree build/compile-tree/<flavor>); conda legs are slim only'
        type: choice
        options: [slim, full, openblas]
        default: slim
      distribution:
        description: 'tree: the dev tree + the stress env; conda: r-zig-slim + r-zig-toolchain + the rows'' sysdeps; both'
        type: choice
        options: [tree, conda, both]
        default: tree
      channel:
        description: 'conda only. local: this run''s conda-package; universe: the packages published on prefix.dev'
        type: choice
        options: [local, universe]
        default: local
      jobs:
        description: 'make -j and cmake parallel level (empty: the runner''s cores, max 8)'
        type: string
        default: ''
      zig:
        description: 'conda: the env''s zig; upstream: PyPI''s ziglang (pixi run fetch-zig), as upstream-zig.yaml'
        type: choice
        options: [conda, upstream]
        default: conda
      trace:
        description: 'RZIG_TRACE=1 (stress.R --trace): rzig prints its commands into the logs, and `rzig build` its tier (feat-zig-pkg-build: the tier table reads it)'
        type: boolean
        default: false
      builder:
        description: 'R_ZIG_PKG_BUILDER: auto, R CMD INSTALL and R CMD SHLIB build through rzig build where the call qualifies (patch 0013); make, the make path for every package and shared object (a make reference)'
        type: choice
        options: [auto, make]
        default: auto
      msys_from_tree:
        description: 'Windows tree legs (stress.R --msys-from-tree): the stress env''s Library/usr/bin and Library/mingw-w64/bin off PATH, so the build-tools group''s usr/bin alone answers for sh, make and the tools R''s makefiles run'
        type: boolean
        default: false
      # b13-env-ci (CI4): the windows-11-arm rows with and without the
      # Rtools45 fallback, one dispatch each
      rtools_libs:
        description: 'windows-11-arm legs: take the libraries conda-forge lacks from CRAN''s Rtools45 aarch64 tree (stress.R''s default); false: stress.R --no-rtools-libs'
        type: boolean
        default: true
      # b13-stress (W9): libs-zig-pixi's own R smoke test after the rows
      libs_smoke:
        description: 'stress.R --libs-smoke=REF: after the rows, libs-zig-pixi''s tests/r/smoke.R at this git ref (empty: off) for sf, terra, gdalraster, s2'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # The toolchain groups for each runner (toolchain.yaml, with the zig
  # input's zig), as build.yaml's toolchain job: the stress task runs the
  # compile tree's R, the dev tree with the groups added (compile-tree.sh),
  # so each leg unpacks its runner's archives first (PHASE3 C3). A job of
  # its own, not `pixi run toolchain` in the leg: the leg's env comes from
  # setup-pixi's cache, where the toolchain build finds no licences (C33).
  toolchain:
    name: ${{ matrix.os }}
    # build.yaml's kill switch
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
    uses: ./.github/workflows/toolchain.yaml
    with:
      os: ${{ matrix.os }}
      zig: ${{ inputs.zig }}

  stress:
    name: ${{ matrix.os }} / ${{ matrix.dist }}${{ inputs.variant != 'slim' && format(' / {0}', inputs.variant) || '' }}
    needs: toolchain
    # build.yaml's kill switch; !cancelled(), as build.yaml's: one
    # runner's failed toolchain leg fails only that runner's legs (C4).
    if: vars.ENABLE_HOSTED_JOBS == 'true' && !cancelled()
    runs-on: ${{ matrix.os }}
    # Hosted jobs stop at 360 minutes. Each package has its own timeout
    # (packages.tsv), so a hang costs one row, not the job.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        dist: ${{ fromJSON(inputs.distribution == 'both' && '["tree","conda"]' || format('["{0}"]', inputs.distribution)) }}
    env:
      STRESS_OUT: build/stress/run
      # the variant's pixi env, which builds its R (build-r.yaml's env
      # input): slim is default's
      STRESS_R_ENV: ${{ inputs.variant == 'slim' && 'default' || inputs.variant }}
    steps:
      # full and openblas are dev-tree variants: the conda legs install
      # r-zig-slim (stress.R --conda); pixi.toml's openblas feature has no
      # win-arm64 (no conda-forge openblas there)
      - name: Check the inputs
        if: inputs.variant != 'slim' && (matrix.dist == 'conda' || (inputs.variant == 'openblas' && runner.os == 'Windows' && runner.arch == 'ARM64'))
        shell: bash
        env:
          DIST: ${{ matrix.dist }}
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ "$DIST" = conda ]; then
            echo "::error::variant=$VARIANT is for the tree legs; the conda legs test r-zig-slim (distribution=tree)"
          else
            echo "::error::variant=openblas: pixi.toml's openblas env has no win-arm64"
          fi
          exit 1
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2  # as build-r.yaml, which says why
          environments: ${{ matrix.dist == 'conda' && inputs.channel == 'local' && 'default stress pkg' || (inputs.variant == 'slim' && 'default stress' || format('default stress {0}', inputs.variant)) }}
          cache: false  # as build-r.yaml, which says why
      # This runner's toolchain groups, as the toolchain job archived
      # them, into dist/ and from there the toolchain tree (as
      # build-r.yaml's legs): the stress task's compile tree needs it.
      - name: Download the toolchain groups (the toolchain job's archives)
        uses: actions/download-artifact@v8
        with:
          name: toolchain-${{ runner.os }}-${{ runner.arch }}${{ inputs.zig == 'upstream' && '-upstream' || '' }}
          path: dist
      - name: Unpack the toolchain tree
        run: pixi run unpack-toolchain
      - name: Upstream zig (ZIG_BIN)
        if: inputs.zig == 'upstream'
        shell: bash
        run: echo "ZIG_BIN=$(pixi run -e stress fetch-zig)" >> "$GITHUB_ENV"
      # The dev tree: what the tree leg tests, and the R that starts the
      # runner in the conda leg (stress.R --conda makes the conda env and
      # runs itself again with that env's R).
      - name: Build R (the dev tree)
        run: pixi run -e ${{ env.STRESS_R_ENV }} build ${{ runner.os == 'Windows' && '-- --verbose' || '' }}
      - name: Build the conda packages
        if: matrix.dist == 'conda' && inputs.channel == 'local'
        run: pixi run -e pkg conda-package
      # Windows on ARM: stress.R takes the libraries conda-forge lacks there
      # from CRAN's Rtools45 aarch64 toolchain-libs tree, on by default
      # (stress/README.md). Only the tarball is cached (396 MiB, from CRAN
      # at run time, never repackaged); stress.R checks its size and
      # sha256 and downloads it again when they differ. The key names the
      # pinned file and the start of its sha256.
      - name: Rtools45 aarch64 libraries (cache)
        if: runner.os == 'Windows' && runner.arch == 'ARM64' && inputs.rtools_libs
        uses: actions/cache@v6
        with:
          path: build/rtools45/rtools45-toolchain-libs-full-aarch64-6768.tar.zst
          key: rtools45-toolchain-libs-full-aarch64-6768-64dceac9ecdd54aa
      - name: Stress
        shell: bash
        # STRESS_-prefixed: the step's environment reaches every package's
        # configure and make, and a plain name leaks into them (ps's
        # configure puts an inherited TARGETS into its Makefile's `all:`)
        env:
          STRESS_TARGETS: ${{ inputs.packages }}
          STRESS_SKIP: ${{ inputs.skip }}
          STRESS_JOBS: ${{ inputs.jobs }}
          STRESS_CHANNEL: ${{ matrix.dist == 'conda' && inputs.channel || '' }}
          STRESS_TRACE: ${{ inputs.trace }}
          STRESS_MSYS_FROM_TREE: ${{ inputs.msys_from_tree }}
          STRESS_RTOOLS_LIBS: ${{ inputs.rtools_libs }}
          STRESS_LIBS_SMOKE: ${{ inputs.libs_smoke }}
          R_ZIG_PKG_BUILDER: ${{ inputs.builder }}
        run: |
          set -euo pipefail
          args=("--out=$STRESS_OUT")
          if [ -n "$STRESS_CHANNEL" ]; then args+=("--conda=$STRESS_CHANNEL"); fi
          if [ -n "$STRESS_SKIP" ]; then args+=("--skip=$STRESS_SKIP"); fi
          if [ "$STRESS_TRACE" = true ]; then args+=("--trace"); fi
          if [ "$STRESS_MSYS_FROM_TREE" = true ] && [ "$RUNNER_OS" = Windows ]; then args+=("--msys-from-tree"); fi
          if [ "$STRESS_RTOOLS_LIBS" = false ] && [ "$RUNNER_OS" = Windows ] && [ "$RUNNER_ARCH" = ARM64 ]; then args+=("--no-rtools-libs"); fi
          if [ -n "$STRESS_LIBS_SMOKE" ]; then args+=("--libs-smoke=$STRESS_LIBS_SMOKE"); fi
          if [ "$STRESS_R_ENV" = default ]; then
            # one target per word
            # shellcheck disable=SC2086
            pixi run -e stress stress "${args[@]}" $STRESS_TARGETS
          else
            # the variant's compile tree (its env's flavor, scripts/env.sh:
            # full, slim-openblas), then stress.R with that tree's R in the
            # stress env, as the stress task runs slim's
            pixi run -e "$STRESS_R_ENV" compile-tree
            flavor=$([ "$STRESS_R_ENV" = openblas ] && echo slim-openblas || echo "$STRESS_R_ENV")
            tree=$(echo "build/compile-tree/$flavor"/R-*-zig)
            [ -d "$tree" ] || { echo "::error::no compile tree build/compile-tree/$flavor/R-*-zig"; exit 1; }
            rscript="$tree/bin/Rscript"
            if [ "$RUNNER_OS" = Windows ]; then rscript="$tree/Library/lib/R/bin/x64/Rscript.exe"; fi
            # shellcheck disable=SC2086
            pixi run -e stress "$rscript" stress/stress.R "${args[@]}" $STRESS_TARGETS
          fi
      # The report is in the job summary already (stress.R appends it to
      # $GITHUB_STEP_SUMMARY); the logs, the smoke files and the conda
      # env's manifest and lock are here.
      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.os }}-${{ matrix.dist }}${{ inputs.variant != 'slim' && format('-{0}', inputs.variant) || '' }}
          path: |
            ${{ env.STRESS_OUT }}/report.*
            ${{ env.STRESS_OUT }}/logs/
            ${{ env.STRESS_OUT }}/smoke/
            ${{ env.STRESS_OUT }}/conda/pixi.*
          if-no-files-found: warn
