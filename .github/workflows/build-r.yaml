name: build-r leg

# One build leg: the same steps in the same order on every OS (feat-no-
# host-paths F1.7), on the tree `zig build` installs, which is the tree
# that ships. Called by build.yaml's matrix (the env's zig, conda-forge's)
# and by upstream-zig.yaml (upstream zig, F4), so both run exactly these
# steps. Each caller's toolchain job (toolchain.yaml) has built this
# platform's toolchain groups first, with the same zig, and the leg
# downloads them (feat-standalone-toolchain B31). No concurrency group
# here: a called workflow shares its caller's `github` context, and the
# callers keep their own.
on:
  workflow_call:
    inputs:
      os:
        description: The runner (runs-on)
        type: string
        required: true
      env:
        description: The pixi environment (default, full, openblas, minimal)
        type: string
        required: true
      build_args:
        description: Extra arguments for `pixi run build`
        type: string
        default: ""
      timeout:
        description: The job's timeout, in minutes
        type: number
        default: 180
      zig:
        description: "conda: the env's zig; upstream: PyPI's ziglang, the ziglang.org release (pixi run fetch-zig)"
        type: string
        default: conda
      recommended:
        description: Build and verify R's recommended packages (build.yaml's full tier)
        type: boolean
        default: false

jobs:
  # Named after the env (the caller names its job after the runner, so a
  # leg reads "<os> / <env>"), plus the zig when it is not the env's.
  build:
    name: ${{ inputs.zig == 'upstream' && format('{0} (upstream zig)', inputs.env) || inputs.env }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # The pixi that wrote pixi.lock, bumped with it (pixi.lock's
          # format 7 needs pixi 0.68 or newer). Unset, setup-pixi installs
          # the newest pixi on every run, and its cache key hashes the pixi
          # binary, so each pixi release would also drop every cached env.
          # The other workflows pin the same version.
          pixi-version: v0.84.2
          # minimal also needs the python-only `wheel` env for its last
          # steps (Windows too since b13-env-ci L2)
          environments: ${{ inputs.env == 'minimal' && 'minimal wheel' || inputs.env }}
          # No cache, as toolchain.yaml: the build's last step (-Dbase)
          # copies the licence files of the packages the tree takes files
          # from, out of pixi's package cache. An env restored from
          # setup-pixi's cache leaves that cache empty and the build stops.
          cache: false
      # This platform's toolchain groups, as the caller's toolchain job
      # archived them (toolchain.yaml; with upstream zig, its -upstream
      # artifact), into dist/, where package-toolchain leaves them, and
      # from there the toolchain tree, dist/toolchain/R-<ver>-zig
      # (unpack-toolchain checks each .sha256). contract compiles in the
      # compile tree, which needs that tree; verify-package extracts the
      # archives themselves beside the base; the wheel takes make from the
      # tree. When that toolchain leg failed, its platform's legs stop
      # here (build.yaml's !cancelled(), PHASE3 C4).
      - name: Download the toolchain groups (the toolchain job's archives)
        uses: actions/download-artifact@v8
        with:
          name: toolchain-${{ runner.os }}-${{ runner.arch }}${{ inputs.zig == 'upstream' && '-upstream' || '' }}
          path: dist
      - name: Unpack the toolchain tree
        run: pixi run -e ${{ inputs.env }} unpack-toolchain
      # Upstream zig (feat-no-host-paths F4): PyPI's ziglang 0.17.1, the
      # ziglang.org release, sha256-pinned (scripts/fetch-zig.sh). ZIG_BIN
      # makes every step below build, compile and test with it instead of
      # the env's zig: zig-build.sh and rzig's tests (scripts/env.sh), rzig
      # (R's compilers), and verify-package's compiles under env -i.
      - name: Upstream zig (ZIG_BIN)
        if: inputs.zig == 'upstream'
        shell: bash
        run: |
          zig="$(pixi run -e ${{ inputs.env }} fetch-zig)"
          echo "ZIG_BIN=$zig" >> "$GITHUB_ENV"
      # minimal's packages in pixi.lock, on all six of its platforms,
      # against scripts/minimal-deny.txt: a partial re-lock can bring the
      # graphics stack or glib into it (pixi.toml, [environments]).
      - name: Check minimal's locked packages
        if: inputs.env == 'minimal'
        run: pixi run -e minimal minimal-check
      # rzig, the compilers zig build installs into R_HOME/bin/toolchain
      # (feat-no-host-paths F3): unit tests on this OS; on linux also
      # link-objects-test.sh (Windows links of CFG code, cross-built).
      - name: rzig tests
        run: pixi run -e ${{ inputs.env }} rzig-test
      # zigbuild/launchers/Rscript, the bin/Rscript of every unix tree,
      # against R's compiled Rscript (src/unix/Rscript.c): rscript-test.sh
      # compares the two case by case (stdout, stderr, exit status), with
      # conda-forge's r-base 4.6.2, the R this tree builds, as the
      # reference, in a throwaway `pixi exec` env (not in pixi.lock). Under
      # /bin/sh (dash) and bash; a mismatch fails the leg. Once per run: on
      # linux-64's default leg with the env's zig, as the launcher is one
      # POSIX sh script for every unix OS and does not use the build
      # (b14-review B4, track launcher-front).
      - name: Rscript launcher against the compiled Rscript (r-base 4.6.2)
        if: runner.os == 'Linux' && runner.arch == 'X64' && inputs.env == 'default' && inputs.zig == 'conda'
        shell: bash
        run: |
          # shellcheck disable=SC2016 # $CONDA_PREFIX is the exec env's
          pixi exec --spec r-base==4.6.2 -- bash -c '
            SH=/bin/sh bash zigbuild/launchers/rscript-test.sh "$CONDA_PREFIX/lib/R" &&
            SH=/bin/bash bash zigbuild/launchers/rscript-test.sh "$CONDA_PREFIX/lib/R"'
      # `zig build` installs the tree that ships (feat-no-host-paths F1,
      # F1.7), with the runtime data it needs from the env (the CA bundle,
      # fontconfig's configuration, Windows full's Tcl/Tk), and zig-build.sh
      # then copies the env's shared libraries into it (vendor-libs.sh;
      # Windows: conda's DLLs into bin/x64). Every check below runs on
      # that tree, and the archive is made from it last (F1.6).
      - name: Build R (zig build alone, no autoconf/make)
        run: pixi run -e ${{ inputs.env }} build ${{ inputs.build_args }}
      # Static checks of the installed tree, before anything runs it:
      # Makeconf, the compilers are rzig, the CA bundle, relative rpaths,
      # the glibc and macOS floors, the C++ runtime, load commands,
      # minimal's excluded libraries, OpenMP inside R; Windows: the DLL
      # closure, grDevices' bitmap libraries and, in full, the Tcl/Tk
      # runtime (scripts/verify-tree.sh). The variants CI packages, and
      # full on every OS: full is the only Windows variant with tcltk.dll,
      # R_HOME/Tcl and libintl.h, so without it nothing in CI checks them
      # (feat-win-variants). One rule for every OS: the check is cheap,
      # and linux-64 full passed it and hermetic locally (feat-zig-017);
      # macOS full runs them first in CI. openblas too: its BLAS
      # forwarders (libRblas/libRlapack, Windows Rblas.dll) and the
      # vendored openblas library are in the closure (b13-build M-7, M-23).
      - name: Verify the installed tree (Makeconf, rzig, libraries, floors)
        if: inputs.env == 'default' || inputs.env == 'minimal' || inputs.env == 'full' || inputs.env == 'openblas'
        run: pixi run -e ${{ inputs.env }} verify-tree
      - name: Smoke test
        run: pixi run -e ${{ inputs.env }} smoke
      # In the compile tree (compile-tree.sh): a copy of the installed
      # tree, the base, with the toolchain tree's group directories added,
      # as a user who extracted all three archives has it. Every leg runs
      # it, full and openblas too, which CI does not package (B31 a).
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ inputs.env }} contract
      # Packages built without make (feat-zig-pkg-build): R CMD INSTALL
      # through rzig build must give the make path's exports and pass rzig
      # the same command lines; a zig package, the fall-through, no make
      # on PATH (scripts/pkg-parity.sh).
      - name: Package parity (rzig build against make)
        run: pixi run -e ${{ inputs.env }} pkg-parity
      - name: Regression suite (Examples/Specific/Reg)
        run: pixi run -e ${{ inputs.env }} check
      # Windows openblas only, after a failed step: stats' ar.ols example
      # dies with 0xC0000005 on AMD runners with AVX-512 (EPYC 9V45, Zen 5;
      # b13-fixes F14, chore-release-13 F1). Likely cause: OpenBLAS 0.3.34's
      # Zen 4/5 block sizes (dgemm Q 512) overrun the Haswell DGEMM kernel's
      # Windows stack buffer (k <= 128); OpenBLAS #6013, b14-openblas F1.
      # In the installed tree, one Rterm process per case:
      #   1. each BLAS/LAPACK call ar.ols makes, alone (inputs built with
      #      matprod "internal", so no other BLAS call runs first);
      #   2. cdb (Debugging Tools for Windows) at the fault: registers,
      #      stack, disassembly, modules;
      #   3. other OPENBLAS_CORETYPE values, one thread, OPENBLAS_L2_SIZE;
      #   4. libopenblas 0.3.33 (pixi exec) in a copy of the tree.
      # Prints the CPU, each case's exit code and output, and a summary.
      # Reports only: the leg stays failed by the step that failed.
      - name: openblas crash diagnostics (Windows, after a failure)
        if: failure() && runner.os == 'Windows' && inputs.env == 'openblas'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          "CPU: $($cpu.Name.Trim()); $($cpu.NumberOfLogicalProcessors) logical; L2 $($cpu.L2CacheSize) KB; L3 $($cpu.L3CacheSize) KB"
          # Rterm.exe, not Rscript.exe: Rscript starts Rterm as a child
          # process, which cdb would not follow.
          $rt = Get-ChildItem dist -Recurse -Filter Rterm.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'slim-openblas\\R-[^\\]+-zig\\Library\\lib\\R\\bin\\x64\\Rterm\.exe$' } |
            Select-Object -First 1
          if (-not $rt) { "no installed openblas Rterm.exe under dist"; exit 0 }
          $rterm = $rt.FullName
          $rterm
          "openblas.dll beside Rterm.exe: $(Test-Path (Join-Path $rt.DirectoryName 'openblas.dll'))"
          $d = Join-Path $env:RUNNER_TEMP 'openblas-diag'
          New-Item -ItemType Directory -Force $d | Out-Null
          # ar.ols(order.max = 6)'s inputs at its largest order (X is
          # 1853 x 25), built with no BLAS call.
          $pre = @(
            'options(matprod = "internal")',
            'x <- diff(log(EuStockMarkets)); y <- embed(x, 7L)',
            'X <- cbind(1, y[, 5:28]); Y <- t(y[, 1:4]); XX <- crossprod(X)',
            'A <- matrix(seq(-1, 1, length.out = 100), 4L); E <- Y - A %*% t(X)',
            'options(matprod = "default")'
          ) -join "`n"
          $calls = [ordered]@{
            'ar.ols'                     = 'invisible(ar.ols(x, order.max = 6, demean = FALSE, intercept = TRUE))'
            'dsyrk crossprod(X) k=1853'  = 'invisible(crossprod(X))'
            'dsyrk k=128'                = 'invisible(crossprod(X[1:128, ]))'
            'dsyrk k=160'                = 'invisible(crossprod(X[1:160, ]))'
            'dsyrk k=512'                = 'invisible(crossprod(X[1:512, ]))'
            'dsyrk tcrossprod(E) k=1853' = 'invisible(tcrossprod(E))'
            'dgemm Y %*% X k=1853'       = 'invisible(Y %*% X)'
            'dgemm A %*% t(X) k=25'      = 'invisible(A %*% t(X))'
            'dqrdc2 qr(XX)'              = 'invisible(qr(XX))'
            'dgesv solve(XX)'            = 'invisible(solve(XX))'
            'dpotrf chol(XX)'            = 'invisible(chol(XX))'
          }
          $script:n = 0
          function New-Case([string]$expr) {
            $script:n++
            $f = Join-Path $d ('case{0:D3}.R' -f $script:n)
            Set-Content -Path $f -Encoding ascii -Value ($pre + "`n" + $expr + "`ncat('ok\n')")
            $f
          }
          $results = New-Object System.Collections.Generic.List[object]
          function Invoke-Case([string]$label, [hashtable]$vars, [string]$exe, [string]$tree = 'installed') {
            $f = New-Case $calls[$label]
            $env:OPENBLAS_VERBOSE = '2'
            foreach ($k in $vars.Keys) { Set-Item "env:$k" $vars[$k] }
            $out = (& $exe --no-echo --vanilla "--file=$f" 2>&1 | ForEach-Object { "$_" }) -join ' | '
            $rc = $LASTEXITCODE
            foreach ($k in $vars.Keys) { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            Remove-Item env:OPENBLAS_VERBOSE -ErrorAction SilentlyContinue
            if ($out.Length -gt 160) { $out = '...' + $out.Substring($out.Length - 160) }
            $envs = ($vars.Keys | ForEach-Object { "$_=$($vars[$_])" }) -join ' '
            $r = [pscustomobject]@{ case = $label; tree = $tree; env = $envs; exit = ('0x{0:X8}' -f $rc); output = $out }
            $results.Add($r)
            "{0,-28} {1,-30} {2}  {3}" -f $r.case, $r.env, $r.exit, $r.output
          }

          "== 1. each call alone, OpenBLAS as is"
          foreach ($c in $calls.Keys) { Invoke-Case $c @{} $rterm }

          "== 2. cdb at the fault"
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits'
          $cdb = Get-ChildItem $kits -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\cdb\.exe$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if ($cdb) {
            $cdb
            # -g: no stop at the start, so -c runs at the first exception
            # (the access violation): the event, registers, stack (dqs: a
            # return address slot full of doubles means an overwritten
            # frame), the code around rip, all threads, the modules, quit.
            # -G: quit when R exits normally. The form OpenBLAS #6013's reporter used.
            $cmds = '.echo == last event;.lastevent;.exr -1;r;.echo == stack;kv 30;dqs @rsp L24;.echo == code;ub @rip L12;u @rip L4;.echo == threads;~*kv 8;.echo == modules;lm;q'
            $env:_NO_DEBUG_HEAP = '1'
            $env:_NT_SYMBOL_PATH = $rt.DirectoryName
            foreach ($c in 'ar.ols', 'dsyrk crossprod(X) k=1853') {
              "-- cdb: $c"
              $f = New-Case $calls[$c]
              & $cdb -g -G -o -lines -c $cmds $rterm --no-echo --vanilla "--file=$f" 2>&1 | Out-Host
            }
            Remove-Item env:_NO_DEBUG_HEAP, env:_NT_SYMBOL_PATH -ErrorAction SilentlyContinue
          } else { "no x64 cdb.exe under $kits" }

          "== 3. core types, one thread, L2 size"
          foreach ($core in 'Haswell', 'Zen', 'SkylakeX', 'Sandybridge', 'Prescott') {
            foreach ($c in 'ar.ols', 'dsyrk k=160', 'dgemm Y %*% X k=1853') {
              Invoke-Case $c @{ OPENBLAS_CORETYPE = $core } $rterm
            }
          }
          Invoke-Case 'ar.ols' @{ OPENBLAS_NUM_THREADS = '1' } $rterm
          # OpenBLAS's L2 override: the Zen 4/5 block needs L2 = 1024 KB.
          Invoke-Case 'ar.ols' @{ OPENBLAS_L2_SIZE = '2048' } $rterm

          "== 4. conda-forge libopenblas 0.3.33 in a copy of the tree (pixi exec; pixi.lock unchanged)"
          $old = pixi exec --spec 'libopenblas=0.3.33=pthreads*' -- where.exe openblas.dll 2>$null |
            Where-Object { $_ -notmatch '\\\.pixi\\envs\\' } | Select-Object -First 1
          if ($old -and (Test-Path $old)) {
            $old
            try {
              $copy = Join-Path $d 'R'
              Copy-Item -Recurse -Force (Split-Path (Split-Path $rt.DirectoryName)) $copy
              Copy-Item -Force $old (Join-Path $copy 'bin\x64\openblas.dll')
              $rt2 = Join-Path $copy 'bin\x64\Rterm.exe'
              foreach ($c in 'ar.ols', 'dsyrk crossprod(X) k=1853', 'dgemm Y %*% X k=1853') { Invoke-Case $c @{} $rt2 '0.3.33 copy' }
            } catch { "copy of the tree failed: $_" }
          } else { "pixi exec gave no openblas.dll for libopenblas 0.3.33" }

          "== summary"
          $results | Format-Table -AutoSize -Wrap -Property case, tree, env, exit, output | Out-String -Width 400
          exit 0
      # R's 15 recommended packages, by their own zig build with the
      # compile tree's R (contract made it), into a tree of their own,
      # dist/recommended/<flavor>/R-<ver>-zig; then its static checks and
      # recipe/test-recommended.R (scripts/verify-recommended.sh). Until
      # chore-env-ci (M-5) only conda-package built them in CI. First that
      # build's unit tests (recommended-test: order.zig's makefile
      # readers), which ran in no workflow before build 14.
      - name: Recommended packages (build + verify)
        if: inputs.recommended
        # bash on Windows too: pwsh would run the next line after a
        # failed one and take only the last exit code
        shell: bash
        run: |
          pixi run -e ${{ inputs.env }} recommended-test
          pixi run -e ${{ inputs.env }} recommended
          pixi run -e ${{ inputs.env }} verify-recommended
      # Tiers 0/1 (feat-no-host-paths): a copy of the installed tree starts
      # R and installs source R-only and binary packages with an empty
      # environment and only its own bin/ on PATH (unix: plus /bin/sh, and
      # on linux strace fails any other program; Windows: bin\x64 plus
      # System32). Also full on every OS, as verify-tree: on Windows full
      # it loads tcltk from R_HOME/Tcl (hermetic-check.sh).
      - name: Hermetic tier 0/1 check (installed tree, empty environment)
        if: inputs.env == 'default' || inputs.env == 'minimal' || inputs.env == 'full'
        run: pixi run -e ${{ inputs.env }} hermetic
      # Standalone archive: package-standalone.sh only archives this job's
      # installed tree (cheap), the base (feat-standalone-toolchain B19).
      # Only the default (slim) and minimal variants, on every OS,
      # are packaged in CI for now — full/openblas relocation is exercised
      # manually, not automated yet (B31 a). minimal's tree is the wheel's
      # input, so it can't be skipped. verify-package checks the archives
      # themselves, the base and this platform's three group archives as
      # downloaded above (it does not rebuild them), extracted elsewhere
      # one after the other, in four scenarios: the base alone, then with
      # the compilers group, then with the build-tools group, then with
      # the extras group (cmake, feat-extras-group). R and
      # packages compiled with them run with nothing from the build env
      # (unix: env -i, TLS with the shipped CA bundle; Windows: what must
      # load from the tree alone runs with only bin\x64 and System32 on
      # PATH) (scripts/verify-bundle.sh, PHASE3 section 8).
      - name: Package + verify the standalone archives (base, compilers, build-tools, extras)
        if: inputs.env == 'default' || inputs.env == 'minimal'
        run: pixi run -e ${{ inputs.env }} verify-package
      # The base archive verify-package checked and its .sha256, kept a
      # short while (B12: CI's artifacts; a release job comes later). The
      # group archives in dist/ are the toolchain job's artifact already.
      - name: Upload the standalone base archive
        if: inputs.env == 'default' || inputs.env == 'minimal'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ inputs.env }}-${{ inputs.os }}${{ inputs.zig == 'upstream' && '-upstream' || '' }}
          path: |
            dist/R-*
            !dist/R-*-compilers.*
            !dist/R-*-build-tools.*
            !dist/R-*-extras.*
          retention-days: 7
          if-no-files-found: error
          # .tar.gz/.zip (and a .sha256): compressing again only costs time
          compression-level: 0
      # The r-zig wheel: the minimal tree verify-package just packaged,
      # zipped with the r_zig Python package, then pip-installed into a
      # fresh venv (ziglang from PyPI) and used with the pixi env scrubbed
      # away — including R CMD INSTALL of a C/C++ package through ziglang.
      # Every OS since b13-env-ci (L2): on Windows make-wheel.py wraps the
      # Library/ tree (win_amd64, win_arm64) and wheel-test runs
      # scripts/wheel-test-windows.py, the same scenarios in Python. The
      # Windows minimal legs are in build-full (the full tier).
      - name: Build + test the r-zig wheel
        if: inputs.env == 'minimal'
        # bash on Windows too: pwsh would run the second line after a
        # failed first one
        shell: bash
        run: |
          pixi run -e wheel wheel
          pixi run -e wheel wheel-test
      - name: Upload the r-zig wheel
        if: inputs.env == 'minimal'
        uses: actions/upload-artifact@v7
        with:
          name: r-zig-wheel-${{ inputs.os }}
          path: dist/wheel/*.whl
          if-no-files-found: error
          compression-level: 0  # a wheel is a zip
