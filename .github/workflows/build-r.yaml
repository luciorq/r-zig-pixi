name: build-r leg

# One build leg: the same steps in the same order on every OS (feat-no-
# host-paths F1.7), on the tree `zig build` installs, which is the tree
# that ships. Called by build.yaml's matrix (the env's zig, conda-forge's)
# and by upstream-zig.yaml (upstream zig, F4), so both run exactly these
# steps. Each caller's toolchain job (toolchain.yaml) has built this
# platform's toolchain groups first, with the same zig, and the leg
# downloads them (feat-standalone-toolchain B31). No concurrency group
# here: a called workflow shares its caller's `github` context, and the
# callers keep their own.
on:
  workflow_call:
    inputs:
      os:
        description: The runner (runs-on)
        type: string
        required: true
      env:
        description: The pixi environment (default, full, openblas, minimal)
        type: string
        required: true
      build_args:
        description: Extra arguments for `pixi run build`
        type: string
        default: ""
      timeout:
        description: The job's timeout, in minutes
        type: number
        default: 180
      zig:
        description: "conda: the env's zig; upstream: PyPI's ziglang, the ziglang.org release (pixi run fetch-zig)"
        type: string
        default: conda

jobs:
  # Named after the env (the caller names its job after the runner, so a
  # leg reads "<os> / <env>"), plus the zig when it is not the env's.
  build:
    name: ${{ inputs.zig == 'upstream' && format('{0} (upstream zig)', inputs.env) || inputs.env }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          # The pixi that wrote pixi.lock, bumped with it (pixi.lock's
          # format 7 needs pixi 0.68 or newer). Unset, setup-pixi installs
          # the newest pixi on every run, and its cache key hashes the pixi
          # binary, so each pixi release would also drop every cached env.
          # The other workflows pin the same version.
          pixi-version: v0.84.2
          # minimal also needs the python-only `wheel` env for its last steps
          environments: ${{ inputs.env == 'minimal' && 'minimal wheel' || inputs.env }}
          # No cache, as toolchain.yaml: the build's last step (-Dbase)
          # copies the licence files of the packages the tree takes files
          # from, out of pixi's package cache. An env restored from
          # setup-pixi's cache leaves that cache empty and the build stops.
          cache: false
      # This platform's toolchain groups, as the caller's toolchain job
      # archived them (toolchain.yaml; with upstream zig, its -upstream
      # artifact), into dist/, where package-toolchain leaves them, and
      # from there the toolchain tree, dist/toolchain/R-<ver>-zig
      # (unpack-toolchain checks each .sha256). contract compiles in the
      # compile tree, which needs that tree; verify-package extracts the
      # archives themselves beside the base; the wheel takes make from the
      # tree. When that toolchain leg failed, its platform's legs stop
      # here (build.yaml's !cancelled(), PHASE3 C4).
      - name: Download the toolchain groups (the toolchain job's archives)
        uses: actions/download-artifact@v8
        with:
          name: toolchain-${{ runner.os }}-${{ runner.arch }}${{ inputs.zig == 'upstream' && '-upstream' || '' }}
          path: dist
      - name: Unpack the toolchain tree
        run: pixi run -e ${{ inputs.env }} unpack-toolchain
      # Upstream zig (feat-no-host-paths F4): PyPI's ziglang 0.17.1, the
      # ziglang.org release, sha256-pinned (scripts/fetch-zig.sh). ZIG_BIN
      # makes every step below build, compile and test with it instead of
      # the env's zig: zig-build.sh and rzig's tests (scripts/env.sh), rzig
      # (R's compilers), and verify-package's compiles under env -i.
      - name: Upstream zig (ZIG_BIN)
        if: inputs.zig == 'upstream'
        shell: bash
        run: |
          zig="$(pixi run -e ${{ inputs.env }} fetch-zig)"
          echo "ZIG_BIN=$zig" >> "$GITHUB_ENV"
      # minimal's packages in pixi.lock, on all four of its platforms,
      # against scripts/minimal-deny.txt: a partial re-lock can bring the
      # graphics stack or glib into it (pixi.toml, [environments]).
      - name: Check minimal's locked packages
        if: inputs.env == 'minimal'
        run: pixi run -e minimal minimal-check
      # rzig, the compilers zig build installs into R_HOME/bin/toolchain
      # (feat-no-host-paths F3): unit tests on this OS; on linux also the
      # parity test against the bash shims for every OS's command lines.
      - name: rzig tests
        run: pixi run -e ${{ inputs.env }} rzig-test
      # `zig build` installs the tree that ships (feat-no-host-paths F1,
      # F1.7), with the runtime data it needs from the env (the CA bundle,
      # fontconfig's configuration, Windows' Tcl/Tk), and zig-build.sh
      # then copies the env's shared libraries into it (vendor-libs.sh;
      # Windows: conda's DLLs into bin/x64). Every check below runs on
      # that tree, and the archive is made from it last (F1.6).
      - name: Build R (zig build alone, no autoconf/make)
        run: pixi run -e ${{ inputs.env }} build ${{ inputs.build_args }}
      # Static checks of the installed tree, before anything runs it:
      # Makeconf, the compilers are rzig, the CA bundle, relative rpaths,
      # the glibc and macOS floors, the C++ runtime, load commands,
      # minimal's excluded libraries; Windows: the Tcl/Tk runtime and the
      # DLL closure (scripts/verify-tree.sh). The variants CI packages.
      - name: Verify the installed tree (Makeconf, rzig, libraries, floors)
        if: inputs.env == 'default' || inputs.env == 'minimal'
        run: pixi run -e ${{ inputs.env }} verify-tree
      - name: Smoke test
        run: pixi run -e ${{ inputs.env }} smoke
      # In the compile tree (compile-tree.sh): a copy of the installed
      # tree, the base, with the toolchain tree's group directories added,
      # as a user who extracted all three archives has it. Every leg runs
      # it, full and openblas too, which CI does not package (B31 a).
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ inputs.env }} contract
      # TEMPORARY (feat-win-arm64): windows-11-arm's first contract run
      # (2026-11-11) ended in a segfault with no line telling which step.
      # Each step again, one R process each, with its exit status; a plain
      # OpenMP library from R CMD SHLIB (libomp without data.table);
      # data.table's grouped sum (the second run's crash) in parts; and
      # under cdb when the image has it.
      # Removed once win-arm64's contract passes.
      - name: win-arm64 probe (the contract's steps, one R process each)
        if: failure() && runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: |
          mkdir -p build/arm-probe
          cat > build/arm-probe/probe.sh <<'PROBE'
          . scripts/env.sh
          set +e +o pipefail
          bin="$COMPILE_TREE/$RH/bin/x64"
          export R_LIBS="$(cygpath -m "$BUILD_DIR/testlib-$VARIANT")"
          d="$BUILD_DIR/arm-probe"
          probe() {
            printf '%s\n' "$2" > "$d/p.R"
            echo "== probe: $1"
            "$bin/Rscript.exe" --vanilla "$(cygpath -m "$d/p.R")" 2>&1 | tail -20
            echo "== rc ${PIPESTATUS[0]}: $1"
          }
          # a plain OpenMP library first: libomp without data.table
          printf '%s\n' '#include <omp.h>' 'void omp_probe(int *n, int *s) { int t = 0;' '#pragma omp parallel reduction(+:t)' '  t += 1;' '  *n = omp_get_max_threads(); *s = t; }' 'void omp_one(int *s) { int t = 0;' '#pragma omp parallel num_threads(1) reduction(+:t)' '  t += 1;' '  *s = t; }' > "$d/omp.c"
          printf '%s\n' 'PKG_CFLAGS = $(SHLIB_OPENMP_CFLAGS)' 'PKG_LIBS = $(SHLIB_OPENMP_CFLAGS)' > "$d/Makevars"
          echo "== SHLIB omp.c"
          (cd "$d" && "$bin/R.exe" CMD SHLIB omp.c 2>&1 | tail -20; echo "== rc ${PIPESTATUS[0]}: SHLIB omp.c")
          omp="$(cygpath -m "$d/omp.dll")"
          probe omp-one "dyn.load('$omp'); print(.C('omp_one', s = 0L))"
          probe omp-all "dyn.load('$omp'); print(.C('omp_probe', n = 0L, s = 0L))"
          dt='library(data.table); setDTthreads(1); dt <- data.table(g = rep(1:3, 4), x = 1:12)'
          probe dt-create "$dt; print(dt)"
          probe dt-sum "$dt; print(dt[, sum(x)])"
          probe dt-order "$dt; print(dt[order(-g)])"
          probe dt-forderv "$dt; print(data.table:::forderv(dt, 'g'))"
          probe dt-by-no-gforce "$dt; options(datatable.optimize = 0L); print(dt[, sum(x), by = g])"
          probe dt-by "$dt; print(dt[, sum(x), by = g])"
          probe dt-threads 'library(data.table); getDTthreads(verbose = TRUE)'
          probe minqa 'library(minqa); print(bobyqa(c(1, 1), function(x) sum((x - 3)^2))$par)'
          probe quadprog 'library(quadprog); print(solve.QP(diag(2, 2), c(2, 6), diag(2), c(0, 0))$solution)'
          probe ps 'print(ps::ps_pid(ps::ps_handle()) == Sys.getpid())'
          # the grouped sum under Windows' debugger, when the image has one: the
          # faulting module, registers and stack (Rterm itself: Rscript starts it
          # as a child)
          cdb=""
          for c in "/c/Program Files (x86)/Windows Kits/10/Debuggers/arm64/cdb.exe" "/c/Program Files/Windows Kits/10/Debuggers/arm64/cdb.exe"; do
            [ -f "$c" ] && { cdb="$c"; break; }
          done
          echo "== cdb: ${cdb:-none}"
          if [ -n "$cdb" ]; then
            printf '%s\n' "$dt; print(dt[, sum(x), by = g])" > "$d/p.R"
            "$cdb" -g -G -c ".lastevent; r; kn 40; ub @pc L8; u @pc L4; lm; q" "$(cygpath -w "$bin/Rterm.exe")" --vanilla --no-echo -f "$(cygpath -m "$d/p.R")" 2>&1 | tail -150
          fi
          PROBE
          pixi run -e ${{ inputs.env }} bash build/arm-probe/probe.sh
      # Packages built without make (feat-zig-pkg-build): R CMD INSTALL
      # through rzig build must give the make path's exports and pass rzig
      # the same command lines; a zig package, the fall-through, no make
      # on PATH (scripts/pkg-parity.sh).
      - name: Package parity (rzig build against make)
        run: pixi run -e ${{ inputs.env }} pkg-parity
      - name: Regression suite (Examples/Specific/Reg)
        run: pixi run -e ${{ inputs.env }} check
      # Tiers 0/1 (feat-no-host-paths): a copy of the installed tree starts
      # R and installs source R-only and binary packages with an empty
      # environment and only its own bin/ on PATH (unix: plus /bin/sh, and
      # on linux strace fails any other program; Windows: bin\x64 plus
      # System32).
      - name: Hermetic tier 0/1 check (installed tree, empty environment)
        if: inputs.env == 'default' || inputs.env == 'minimal'
        run: pixi run -e ${{ inputs.env }} hermetic
      # Standalone archive: package-standalone.sh only archives this job's
      # installed tree (cheap), the base (feat-standalone-toolchain B19).
      # Only the default (slim; Windows' one variant) and minimal variants
      # are packaged in CI for now — full/openblas relocation is exercised
      # manually, not automated yet (B31 a). minimal's tree is the wheel's
      # input, so it can't be skipped. verify-package checks the archives
      # themselves, the base and this platform's two group archives as
      # downloaded above (it does not rebuild them), extracted elsewhere
      # one after the other, in three scenarios: the base alone, then with
      # the compilers group, then with the build-tools group. R and
      # packages compiled with them run with nothing from the build env
      # (unix: env -i, TLS with the shipped CA bundle; Windows: what must
      # load from the tree alone runs with only bin\x64 and System32 on
      # PATH) (scripts/verify-bundle.sh, PHASE3 section 8).
      - name: Package + verify the standalone archives (base, compilers, build-tools)
        if: inputs.env == 'default' || inputs.env == 'minimal'
        run: pixi run -e ${{ inputs.env }} verify-package
      # The base archive verify-package checked and its .sha256, kept a
      # short while (B12: CI's artifacts; a release job comes later). The
      # group archives in dist/ are the toolchain job's artifact already.
      - name: Upload the standalone base archive
        if: inputs.env == 'default' || inputs.env == 'minimal'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ inputs.env }}-${{ inputs.os }}${{ inputs.zig == 'upstream' && '-upstream' || '' }}
          path: |
            dist/R-*
            !dist/R-*-compilers.*
            !dist/R-*-build-tools.*
          retention-days: 7
          if-no-files-found: error
      # The r-zig wheel: the minimal tree verify-package just packaged,
      # zipped with the r_zig Python package, then pip-installed into a
      # fresh venv (ziglang from PyPI) and used with the pixi env scrubbed
      # away — including R CMD INSTALL of a C/C++ package through ziglang.
      - name: Build + test the r-zig wheel
        if: inputs.env == 'minimal'
        run: |
          pixi run -e wheel wheel
          pixi run -e wheel wheel-test
      - name: Upload the r-zig wheel
        if: inputs.env == 'minimal'
        uses: actions/upload-artifact@v7
        with:
          name: r-zig-wheel-${{ inputs.os }}
          path: dist/wheel/*.whl
          if-no-files-found: error
