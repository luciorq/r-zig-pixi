name: win-arm64

# Windows on ARM (feat-win-arm64; the user's decision of 2026-11-10: a
# GitHub-hosted windows-11-arm runner behind a label). The same steps as
# every other platform: the toolchain groups (toolchain.yaml), then one
# build leg (build-r.yaml) on the default env, then the conda packages
# and the fresh-env consume test, as build.yaml's conda-package legs, on
# the env's zig (conda-forge's win-arm64 zig). Nothing publishes here:
# win-arm64 joins build.yaml's matrix and the publish once these legs
# pass. It runs on demand and on pull requests labelled `win-arm64`.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths-ignore:
      - "**/*.md"
      - ".github/devdocs/**"
      - "LICENSE"

# One run per ref, a newer one cancelling the older, as upstream-zig.yaml.
# A pull request event that runs nothing here (another label added) gets
# a group of its own, so that it cannot cancel a run of the legs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'win-arm64') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: windows-11-arm
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'win-arm64') &&
        (github.event.action != 'labeled' || github.event.label.name == 'win-arm64')))
    uses: ./.github/workflows/toolchain.yaml
    with:
      os: windows-11-arm

  build:
    name: windows-11-arm
    needs: toolchain
    # !cancelled(), as build.yaml's: a failed toolchain leg fails this one
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' && !cancelled() &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'win-arm64') &&
        (github.event.action != 'labeled' || github.event.label.name == 'win-arm64')))
    uses: ./.github/workflows/build-r.yaml
    with:
      os: windows-11-arm
      env: default
      # as build.yaml's Windows leg (--verbose); longer, for a runner
      # whose MSYS2 tools run under x64 emulation
      build_args: "-- --verbose"
      timeout: 150

  conda-package:
    name: conda-package / win-arm64
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'win-arm64') &&
        (github.event.action != 'labeled' || github.event.label.name == 'win-arm64')))
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.84.2  # as build-r.yaml, which says why
          environments: pkg
          cache: true
      - name: Build + test conda package
        run: pixi run -e pkg conda-package
      - name: Fresh-env consume test (each group alone)
        run: pixi run -e pkg conda-consume
