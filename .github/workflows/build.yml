name: build-r

on:
  push:
    branches: [main]
  pull_request:

# Every job starts from a bare runner: the only bootstrap is pixi itself.
# All compilers, shells, and libraries come from conda-forge via pixi.
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        env: [default, full]
        include:
          # external optimized BLAS/LAPACK variant
          - os: ubuntu-latest
            env: openblas
          # macOS is milestone 2: scripts are wired (gfortran instead of
          # flang) but not yet validated — allowed to fail without gating.
          - os: macos-latest
            env: default
            experimental: true
          - os: macos-latest
            env: full
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Build R
        run: pixi run -e ${{ matrix.env }} build
      - name: Smoke test
        run: pixi run -e ${{ matrix.env }} smoke
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ matrix.env }} contract
      - name: Regression suite
        if: matrix.os == 'ubuntu-latest'
        run: pixi run -e ${{ matrix.env }} check

  # Windows builds via src/gnuwin32 driven by scripts/build-gnuwin32.sh
  # (zig cc MinGW target + conda-forge MinGW gfortran). Proven on real
  # hardware; non-gating until it has a track record on GH runners —
  # drop continue-on-error once consistently green.
  # NB: slim==full on Windows (gnuwin32 has no slim switches), so only
  # the default environment is built.
  build-windows:
    name: windows-latest / default
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          cache: true
      - name: Build R (gnuwin32 + zig)
        run: pixi run build
      - name: Smoke test
        run: pixi run smoke
      - name: Package contract test (Rcpp, data.table, minqa)
        run: pixi run contract
