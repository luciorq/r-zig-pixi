name: win-binary

# M-24 (b13-env-ci): an experiment, not a gate, and not the default.
# r-zig's Windows R reports .Platform$pkgType "source" (build.zig does
# not pass R's -DPLATFORM_PKGTYPE="win.binary"; user decision
# 2026-11-14, chore-release-11 PLAN.md finding 22): install.packages()
# builds every package with r-zig's toolchain, as on linux and macOS.
# The opt-in is R's own R_PLATFORM_PKGTYPE=win.binary (R 4.6), in the
# environment or in R_HOME/etc/Renviron.site: .Platform$pkgType becomes
# "win.binary" and getOption("pkgType") "both", so install.packages()
# takes CRAN's binary where one exists. options(pkgType = "both") in an
# Rprofile is not enough: install.packages() refuses "both" while
# .Platform$pkgType is "source". Nothing in R_HOME changes.
# This job installs the published r-zig-slim and r-zig-toolchain
# (universe) on windows-latest and runs one R session with the opt-in
# (and once without, the baseline): CRAN binaries with DLLs (jsonlite,
# data.table with OpenMP, Rcpp, quadprog with Fortran and BLAS) next to
# a package built from source (fastmap), all loaded together, and Rcpp
# code compiled at run time (cppFunction) against the installed Rcpp,
# throwing a C++ exception, in a child R. The result is in the log
# (b13-env-ci PLAN.md has kappa's). win-64 only: CRAN has no aarch64
# Windows binaries. Manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-binary:
    name: windows-latest / ${{ matrix.pkgtype || 'source (baseline)' }}
    # build.yaml's kill switch
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pkgtype: ['win.binary', '']
    steps:
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2  # as build-r.yaml, which says why
          run-install: false
      - name: The published packages (universe first, as the README says)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wb"
          cat > "$RUNNER_TEMP/wb/pixi.toml" <<'EOF'
          [workspace]
          name = "win-binary"
          channels = ["https://prefix.dev/universe", "conda-forge"]
          platforms = ["win-64"]

          [dependencies]
          r-zig-slim = "*"
          r-zig-toolchain = "*"
          EOF
          cd "$RUNNER_TEMP/wb" && pixi install && pixi list r-zig
      - name: One session, CRAN binaries and source builds
        shell: bash
        env:
          R_PLATFORM_PKGTYPE: ${{ matrix.pkgtype }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/wb/win-binary.R" <<'EOF'
          ## M-24 (b13-env-ci): CRAN's win.binary packages next to packages built
          ## from source with r-zig's toolchain, in one R session, with
          ## R_PLATFORM_PKGTYPE=win.binary (the opt-in: getOption("pkgType")
          ## becomes "both", install.packages() takes CRAN's binary where there is
          ## one). win-64 only: CRAN has no aarch64 Windows binaries.
          stopifnot(.Platform$OS.type == "windows")
          cat("R_PLATFORM_PKGTYPE =", Sys.getenv("R_PLATFORM_PKGTYPE"),
              "| .Platform$pkgType =", .Platform$pkgType, "| getOption('pkgType') =", getOption("pkgType"), "\n")
          if (R.version$arch != "x86_64") { cat("skipped: CRAN has no binaries for", R.version$arch, "\n"); quit(status = 0) }
          lib <- file.path(tempdir(), "lib"); dir.create(lib)
          .libPaths(c(lib, .libPaths()))
          options(repos = c(CRAN = "https://cloud.r-project.org"), Ncpus = 2)
          warns <- character()
          keep <- function(expr) withCallingHandlers(expr, warning = function(w) {
            warns <<- c(warns, conditionMessage(w)); invokeRestart("muffleWarning") })
          ## binaries with DLLs: C (jsonlite), OpenMP (data.table), C++ (Rcpp),
          ## Fortran and BLAS (quadprog); the default type, as a user's call
          bin <- c("jsonlite", "data.table", "Rcpp", "quadprog")
          keep(install.packages(bin, lib = lib))
          ## the same session also builds from source with r-zig's toolchain: a
          ## CRAN package with C++ (fastmap) and Rcpp code at run time
          ## (cppFunction, against the binary Rcpp's headers and DLL)
          keep(install.packages("fastmap", lib = lib, type = "source"))
          how <- vapply(c(bin, "fastmap"), function(p) {
            d <- system.file(package = p, lib.loc = lib)
            ## CRAN's binary zips carry an MD5 file; a source install writes none
            if (file.exists(file.path(d, "MD5"))) "binary" else "source"
          }, "")
          built <- vapply(c(bin, "fastmap"), function(p) packageDescription(p, lib.loc = lib)$Built, "")
          print(data.frame(package = names(how), installed = how, built = built), row.names = FALSE)
          for (p in c(bin, "fastmap")) keep(library(p, character.only = TRUE, lib.loc = lib))
          ## Rcpp code compiled here (zig: libc++) against the installed Rcpp. A
          ## child R, since a crash ends the process: the exit status is the result
          cx <- file.path(tempdir(), "cx.R")
          writeLines(c(sprintf(".libPaths(c('%s', .libPaths()))", gsub("\\\\", "/", lib)),
                       "f <- Rcpp::cppFunction('int f(int x) { if (x < 0) throw std::range_error(\"neg\"); return x; }')",
                       "stopifnot(f(2L) == 2L); r <- try(f(-1L), silent = TRUE); stopifnot(inherits(r, 'try-error'))",
                       "cat('exception caught as an R error\\n')"), cx)
          st <- system2(file.path(R.home("bin"), "Rscript.exe"), shQuote(cx))
          cat(sprintf("Rcpp (%s) + cppFunction (zig): a C++ exception: %s\n", how[["Rcpp"]],
                      if (st == 0) "caught, OK" else paste("R exited", st)))
          stopifnot(identical(jsonlite::fromJSON(jsonlite::toJSON(list(a = 1:3)))$a, 1:3))
          data.table::setDTthreads(2)
          dt <- data.table::data.table(a = sample(1e6))
          data.table::setorder(dt, a)
          stopifnot(!is.unsorted(dt$a))
          cat("data.table threads:", data.table::getDTthreads(), "\n")
          qp <- quadprog::solve.QP(diag(2), c(1, 1), matrix(c(1, 1), 2), 1)
          stopifnot(all(abs(qp$solution - 1) < 1e-8))
          m <- fastmap::fastmap(); m$set("k", 1); stopifnot(m$get("k") == 1)
          ## which C/C++/OpenMP runtimes the loaded DLLs import
          dlls <- vapply(getLoadedDLLs(), function(d) d[["path"]], "")
          print(unname(dlls[startsWith(normalizePath(dlls, "/", FALSE), normalizePath(lib, "/", FALSE))]))
          if (exists("R_compiled_by")) print(R_compiled_by())
          cat("warnings:", if (length(warns)) paste0("\n  ", unique(warns)) else "none", "\n")
          cat("win.binary experiment: OK\n")
          EOF
          cd "$RUNNER_TEMP/wb" && pixi run Rscript win-binary.R
