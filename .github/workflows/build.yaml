name: build-r

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a still-running run for the same branch/PR the moment a newer
# commit lands (or a second manual dispatch fires) — keeps stale runs
# from burning runner time behind the current commit. (Historically this
# mattered most for the self-hosted gamma/omicron/kappa fleet, since
# decommissioned — everything runs on GitHub-hosted runners now.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job starts from a bare runner: the only bootstrap is pixi itself.
# All compilers, shells, and libraries come from conda-forge via pixi.
jobs:
  # Only build path: `zig build` alone (no autoconf, no make, no
  # gnuwin32) — see .github/devdocs/feat-zig-build/. The autoconf/gnuwin32
  # legacy jobs that used to sit alongside this one were retired in
  # Milestone 7 — see .github/devdocs/feat-legacy-retirement/.
  build:
    name: ${{ matrix.os }} / ${{ matrix.env }}
    # Gated behind ENABLE_HOSTED_JOBS (repo Settings > Actions > Variables)
    # — an emergency kill switch more than a cost control now: the repo
    # is public, so hosted standard runners are free with no minute caps
    # (the gate's original reason, a private-repo minute budget, is gone).
    # Toggle with `gh variable set ENABLE_HOSTED_JOBS --body false`.
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: ${{ matrix.os }}
    # The arch axis arrived with the repo going public (2026-09-03):
    # GitHub-hosted arm64-linux (ubuntu-24.04-arm) and Intel-macOS
    # (macos-15-intel) runners are free for public repos, dissolving the
    # "no hardware access" boundary feat-cross-platform-standardization/
    # PLAN.md's Phase 7 was scoped around — linux-aarch64 and osx-64 are
    # now first-class legs. Still absent: win-arm64 (a runner exists, but
    # build.zig's Windows path is x86_64-only by explicit design — the
    # MinGW prefix and R_ARCH="x64" convention need an upstream design
    # decision first; see PLAN.md's Phase 2 non-goal).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        env: [default, full]
        include:
          # external optimized BLAS/LAPACK variant (linux only for now,
          # both linux archs)
          - os: ubuntu-latest
            env: openblas
          - os: ubuntu-24.04-arm
            env: openblas
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Build R (zig build alone, no autoconf/make)
        run: pixi run -e ${{ matrix.env }} build
      - name: Smoke test
        run: pixi run -e ${{ matrix.env }} smoke
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ matrix.env }} contract
      - name: Regression suite (Examples/Specific/Reg)
        run: pixi run -e ${{ matrix.env }} check
      # Standalone bundle: reuses this job's already-built prefix (cheap).
      # Only the default (slim) variant is packaged in CI for now — full/
      # openblas relocation is exercised manually, not automated yet.
      - name: Package + verify standalone bundle
        if: matrix.env == 'default'
        run: pixi run -e ${{ matrix.env }} verify-package

  # `zig build` on Windows — no `check` step (make-check parity was never
  # in scope for Windows, see FINALIZATION.md F6: addCheckStep is only
  # wired into the unix build() path). The package-compilation contract
  # (Makeconf.win wiring, a real R.exe CMD dispatcher, native gcc.exe/
  # g++.exe wrappers) IS done — see FINALIZATION.md F7 — so `contract`
  # runs here same as linux/macOS.
  build-windows:
    name: windows-latest / default
    # Gated behind ENABLE_HOSTED_JOBS — see `build` job above for details.
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          cache: true
      - name: Build R (zig build alone, no autoconf/make/gnuwin32)
        run: pixi run build
      - name: Smoke test
        run: pixi run smoke
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run contract
      - name: Package + verify standalone bundle
        run: pixi run verify-package

  # conda-forge-style package (rattler-build) — always the slim variant
  # regardless of matrix.env above, since recipe/build.sh never sets
  # R_BUILD_VARIANT. A from-scratch build in its own isolated sandbox, so
  # it can't reuse the `build`/`build-windows` jobs' prefixes; that
  # roughly doubles per-platform CI time, which is the tradeoff for
  # catching a recipe regression before a real release. All 5 platforms
  # on GitHub-hosted runners — the self-hosted gamma/omicron/kappa fleet
  # is decommissioned (2026-09-19; see CI_SELF_HOSTED_PLAN.md's closing
  # note). Publishing uses prefix.dev trusted publishing (OIDC):
  # `id-token: write` lets rattler-build mint a short-lived token, no
  # stored credentials on any runner. Requires this repo+workflow to be
  # registered as a Trusted Publisher in the `universe` channel's
  # settings on prefix.dev.
  conda-package:
    name: conda-package / ${{ matrix.name }}
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: osx-arm64
            runner: macos-latest
          - name: osx-64
            runner: macos-15-intel
          - name: win-64
            runner: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: pkg
          cache: true
      - name: Build + test conda package
        run: pixi run -e pkg conda-package
      # rattler-build's own test phase runs with a literal unexpanded
      # %PREFIX% on PATH on Windows, so it can never exercise the
      # Library/bin/{R,Rscript}.bat shims a real install relies on (see
      # recipe/recipe.yaml's win test comment + scripts/stage.sh). This
      # is the regression check for that: a genuinely fresh pixi project
      # installing straight from the just-built local channel, invoking
      # bare `Rscript` the same way a real user would. (Was disabled on
      # the old self-hosted kappa runner, whose PATH put WSL's bash.exe
      # first; hosted windows-latest has no WSL-bash-on-PATH problem.)
      - name: Fresh-env consume test (Windows PATH shim)
        if: matrix.name == 'win-64'
        shell: bash
        run: |
          set -euo pipefail;
          channel="$(cd dist/conda && pwd -W)";
          consume_dir="$(mktemp -d)";
          pixi init --channel "$channel" --channel conda-forge --platform win-64 "$consume_dir";
          cd "$consume_dir";
          pixi add r-zig-slim;
          pixi run Rscript -e 'r_home <- R.home(); cat("R_HOME =", r_home, "\n"); stopifnot(grepl("Library", r_home, fixed = TRUE)); cat("consume test OK\n")';
      - name: Publish to prefix.dev (OIDC trusted publishing)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pixi run -e pkg conda-publish
