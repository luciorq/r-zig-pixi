name: build-r

# Two tiers, so that a commit runs what it can break and the expensive
# legs run only when asked for (.github/devdocs/chore-ci-tiers/PLAN.md):
# - core, on every pull request push and every push to main: the default
#   leg on all 5 platforms and minimal on linux-64, the wheel's (6 legs);
# - full, on a pull request labelled `full-ci` and on a manual dispatch,
#   nothing else: all 15 legs (full, openblas and minimal too).
# conda-package (5 jobs) runs on every push to main, which publishes, in
# the full tier, and on a pull request that changes what it builds from.
# Docs-only changes never touch the build: they start nothing. On a pull
# request the paths are matched against its whole diff, so once it
# changes code, a docs-only push to it runs the core tier too. Note the
# consequence for branch protection: a docs-only PR reports no build-r
# checks at all, so don't mark them "required" or such PRs can't merge
# (main requires none). No `[skip ci]` needed, and it skips more than its
# own commit: in the newest commit of a push it skips the whole push,
# which is how #15's merge of main went untested.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/devdocs/**"
      - "LICENSE"
  pull_request:
    # labeled: adding `full-ci` starts the full tier at once. Any other
    # label starts nothing (the jobs' conditions).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - ".github/devdocs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      # A runner image before ubuntu-latest moves to it, e.g. ubuntu-26.04
      # (ubuntu-latest from 2026-10-19): `gh workflow run build.yaml
      # --ref <branch> -f linux_runner=ubuntu-26.04`. Only main publishes.
      linux_runner:
        description: Runner for the linux-64 legs
        type: string
        default: ubuntu-latest

# A newer push to a pull request cancels its older run (the group is the
# pull request's number): the old commit's result no longer matters.
# Runs on main are never cancelled, since each commit on main is tested
# and publishes, and neither are manual dispatches: each such run has a
# group of its own, its run id. So does a pull request event that runs
# nothing here (another label added), so that it cannot cancel a run of
# the legs.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

# Every job starts from a bare runner: the only bootstrap is pixi itself.
# All compilers, shells, and libraries come from conda-forge via pixi.
jobs:
  # Only build path: `zig build` alone (no autoconf, no make, no
  # gnuwin32) — see .github/devdocs/feat-zig-build/. The autoconf/gnuwin32
  # legacy jobs that used to sit alongside this one were retired in
  # Milestone 7 — see .github/devdocs/feat-legacy-retirement/. One job for
  # every OS, Windows included (feat-no-host-paths F1.7): the same steps in
  # the same order everywhere, on the tree `zig build` installs, which is
  # the tree that ships.
  # The steps themselves are in build-r.yaml, which upstream-zig.yaml
  # calls too (the same legs with upstream zig, F4): one step list. A leg
  # reads "<os> / <env>": this job is named after the runner, the called
  # one after the env. This job runs the core tier's 6 legs, build-full
  # the full tier's other 9.
  build:
    name: ${{ matrix.os }}
    # Gated behind ENABLE_HOSTED_JOBS (repo Settings > Actions > Variables)
    # — an emergency kill switch more than a cost control now: the repo
    # is public, so hosted standard runners are free with no minute caps
    # (the gate's original reason, a private-repo minute budget, is gone).
    # Toggle with `gh variable set ENABLE_HOSTED_JOBS --body false`.
    # Every job has it. A `labeled` event runs these legs only for
    # `full-ci` (its full tier includes them).
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # The arch axis arrived with the repo going public (2026-09-03):
    # GitHub-hosted arm64-linux (ubuntu-24.04-arm) and Intel-macOS
    # (macos-15-intel) runners are free for public repos, dissolving the
    # "no hardware access" boundary feat-cross-platform-standardization/
    # PLAN.md's Phase 7 was scoped around — linux-aarch64 and osx-64 are
    # now first-class legs. Still absent: win-arm64 (a runner exists, but
    # build.zig's Windows path is x86_64-only by explicit design — the
    # MinGW prefix and R_ARCH="x64" convention need an upstream design
    # decision first; see PLAN.md's Phase 2 non-goal).
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ inputs.linux_runner || 'ubuntu-latest' }}", ubuntu-24.04-arm, macos-latest, macos-15-intel]
        env: [default]
        include:
          # minimal: the r-zig Python wheel's variant (pixi.toml
          # [feature.minimal]); unix only. In the core tier on linux-64,
          # whose wheel it builds and tests; the other three are in
          # build-full. linux-x86_64's vendored config was captured
          # locally, the other three by gen-config's minimal legs (run
          # 36151245208, 2026-09-25).
          - os: ${{ inputs.linux_runner || 'ubuntu-latest' }}
            env: minimal
          # Windows: one variant only (R's Windows build has no slim/
          # minimal switches; no wheel, no openblas), so only `default`.
          # build_args: zig build prints nothing until it finishes, so a
          # hung step leaves an empty log; with --verbose the last command
          # started is the last line, which is the diagnosis.
          # timeout: windows-latest's MSYS process spawning flakes
          # ("cygheap read copy failed") have twice turned a build into a
          # silent hang (2026-09-20). The leg took ~20 min when healthy
          # before it ran R's regression suite; 90 leaves room for that and
          # still fails a hang long before the 180 of the other legs.
          - os: windows-latest
            env: default
            build_args: "-- --verbose"
            timeout: 90
    uses: ./.github/workflows/build-r.yaml
    with:
      os: ${{ matrix.os }}
      env: ${{ matrix.env }}
      build_args: ${{ matrix.build_args }}
      timeout: ${{ matrix.timeout || 180 }}

  # The full tier's other 9 legs, on the same runners: full on the four
  # unix ones, openblas (external optimized BLAS/LAPACK, linux only for
  # now, both archs), and minimal on the three build doesn't run. Only on
  # a pull request labelled `full-ci` (its `labeled` event, then every
  # push while the label stays) and on a manual dispatch.
  build-full:
    name: ${{ matrix.os }}
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(github.event.pull_request.labels.*.name, 'full-ci') &&
        (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    strategy:
      fail-fast: false
      matrix:
        os: ["${{ inputs.linux_runner || 'ubuntu-latest' }}", ubuntu-24.04-arm, macos-latest, macos-15-intel]
        env: [full]
        include:
          - os: ${{ inputs.linux_runner || 'ubuntu-latest' }}
            env: openblas
          - os: ubuntu-24.04-arm
            env: openblas
          - os: ubuntu-24.04-arm
            env: minimal
          - os: macos-latest
            env: minimal
          - os: macos-15-intel
            env: minimal
    uses: ./.github/workflows/build-r.yaml
    with:
      os: ${{ matrix.os }}
      env: ${{ matrix.env }}

  # Does the pull request change what conda-package builds from? The
  # recipe, the envs (pixi.toml, pixi.lock), the build (build.zig,
  # zigbuild/, scripts/) or the workflows. Read from GitHub's list of the
  # pull request's files, its whole diff (base...head) as paths-ignore
  # reads it, so a later push that touches no such file still packages a
  # pull request that changed the recipe. The log lists the files that
  # matched. Not needed with `full-ci`, on push or on dispatch: those
  # package anyway. If the list can't be read, it says yes: a spare job
  # beats an untested recipe. No checkout and no pixi: it builds nothing,
  # the runner's gh only reads the API.
  packaging:
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' &&
      github.event_name == 'pull_request' && github.event.action != 'labeled' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.files.outputs.changed }}
    steps:
      - name: Files of the pull request
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100
        run: |
          if ! files="$(gh api --paginate "$FILES" --jq '.[] | .filename, .previous_filename // empty')"; then
            echo "::warning::could not list the pull request's files: packaging anyway"
            changed=true
          elif grep -E '^(recipe/|pixi\.toml$|pixi\.lock$|build\.zig$|zigbuild/|scripts/|\.github/workflows/)' <<< "$files"; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" | tee -a "$GITHUB_OUTPUT"

  # conda-forge-style package (rattler-build) — always the slim variant
  # regardless of matrix.env above, since recipe/build.sh never sets
  # R_BUILD_VARIANT. A from-scratch build in its own isolated sandbox, so
  # it can't reuse the `build` job's prefixes; that
  # roughly doubles per-platform CI time, which is the tradeoff for
  # catching a recipe regression before a real release. All 5 platforms
  # on GitHub-hosted runners — the self-hosted gamma/omicron/kappa fleet
  # is decommissioned (2026-09-19; see CI_SELF_HOSTED_PLAN.md's closing
  # note). Publishing uses prefix.dev trusted publishing (OIDC):
  # `id-token: write` lets rattler-build mint a short-lived token, no
  # stored credentials on any runner. Requires this repo+workflow to be
  # registered as a Trusted Publisher in the `universe` channel's
  # settings on prefix.dev.
  # It runs on every push to main (publishing needs it) and every manual
  # dispatch; on a pull request, with `full-ci` or when packaging says
  # the pull request changes what it builds from. !cancelled(), because
  # packaging is skipped in all the other cases, and a job whose need was
  # skipped is skipped too unless its condition has a status function.
  conda-package:
    name: conda-package / ${{ matrix.name }}
    needs: packaging
    if: >-
      vars.ENABLE_HOSTED_JOBS == 'true' && !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.packaging.outputs.changed == 'true' ||
       (contains(github.event.pull_request.labels.*.name, 'full-ci') &&
        (github.event.action != 'labeled' || github.event.label.name == 'full-ci')))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-64
            runner: ${{ inputs.linux_runner || 'ubuntu-latest' }}
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: osx-arm64
            runner: macos-latest
          - name: osx-64
            runner: macos-15-intel
          - name: win-64
            runner: windows-latest
    # 90, not 300: the longest leg (win-64, from-scratch rattler-build
    # sandbox) takes ~15 min when healthy; windows-latest's MSYS spawn
    # flake has hung a build inside this sandbox before (2026-09-20),
    # where the build job's Windows --verbose guard doesn't reach. Fail
    # fast, re-run the leg.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0  # as build-r.yaml, which says why
          environments: pkg
          cache: true
      - name: Build + test conda package
        run: pixi run -e pkg conda-package
      # rattler-build's own test phase runs with a literal unexpanded
      # %PREFIX% on PATH on Windows, so it can never exercise the
      # Library/bin/{R,Rscript}.bat shims a real install relies on (see
      # recipe/recipe.yaml's win test comment + build.zig's Library/bin/*.bat). This
      # is the regression check for that: a genuinely fresh pixi project
      # installing straight from the just-built local channel, invoking
      # bare `Rscript` the same way a real user would. (Was disabled on
      # the old self-hosted kappa runner, whose PATH put WSL's bash.exe
      # first; hosted windows-latest has no WSL-bash-on-PATH problem.)
      - name: Fresh-env consume test (Windows PATH shim)
        if: matrix.name == 'win-64'
        shell: bash
        run: |
          set -euo pipefail;
          channel="$(cd dist/conda && pwd -W)";
          consume_dir="$(mktemp -d)";
          pixi init --channel "$channel" --channel conda-forge --channel https://prefix.dev/universe --platform win-64 "$consume_dir";
          cd "$consume_dir";
          pixi add r-zig-slim;
          pixi run Rscript -e 'r_home <- R.home(); cat("R_HOME =", r_home, "\n"); stopifnot(grepl("Library", r_home, fixed = TRUE)); cat("consume test OK\n")';
      - name: Publish to prefix.dev (OIDC trusted publishing)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pixi run -e pkg conda-publish
