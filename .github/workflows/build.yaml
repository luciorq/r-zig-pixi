name: build-r

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a still-running run for the same branch/PR the moment a newer
# commit lands (or a second manual dispatch fires) — matters most on the
# self-hosted matrix (gamma/omicron/kappa), where each label set is a
# single physical machine, so a stale run would otherwise sit occupying
# the runner queue behind/instead of the current commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job starts from a bare runner: the only bootstrap is pixi itself.
# All compilers, shells, and libraries come from conda-forge via pixi.
jobs:
  # Default build path: `zig build` alone (no autoconf, no make, no
  # gnuwin32) — see .github/devdocs/feat-zig-build/. Milestone 5's F1-F6
  # are all green on linux/macOS/Windows, so this job (not `build-legacy`
  # below) is now the primary one.
  build:
    name: ${{ matrix.os }} / ${{ matrix.env }}
    # Gated behind ENABLE_HOSTED_JOBS (repo Settings > Actions > Variables)
    # — off by default while out of GitHub Actions minutes. Toggle with
    # `gh variable set ENABLE_HOSTED_JOBS --body true` when minutes are
    # available again; conda-package below is unaffected (self-hosted).
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, full]
        include:
          # external optimized BLAS/LAPACK variant (linux only for now)
          - os: ubuntu-latest
            env: openblas
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Build R (zig build alone, no autoconf/make)
        run: pixi run -e ${{ matrix.env }} build
      - name: Smoke test
        run: pixi run -e ${{ matrix.env }} smoke
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ matrix.env }} contract
      - name: Regression suite (Examples/Specific/Reg)
        run: pixi run -e ${{ matrix.env }} check
      # Standalone bundle: reuses this job's already-built prefix (cheap).
      # Only the default (slim) variant is packaged in CI for now — full/
      # openblas relocation is exercised manually, not automated yet.
      - name: Package + verify standalone bundle
        if: matrix.env == 'default'
        run: pixi run -e ${{ matrix.env }} verify-package

  # `zig build` on Windows — no `check` step (make-check parity was never
  # in scope for Windows, see FINALIZATION.md F6: addCheckStep is only
  # wired into the unix build() path). The package-compilation contract
  # (Makeconf.win wiring, a real R.exe CMD dispatcher, native gcc.exe/
  # g++.exe wrappers) IS done — see FINALIZATION.md F7 — so `contract`
  # runs here same as linux/macOS.
  build-windows:
    name: windows-latest / default
    # Gated behind ENABLE_HOSTED_JOBS — see `build` job above for details.
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          cache: true
      - name: Build R (zig build alone, no autoconf/make/gnuwin32)
        run: pixi run build
      - name: Smoke test
        run: pixi run smoke
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run contract
      - name: Package + verify standalone bundle
        run: pixi run verify-package

  # Legacy autoconf (unix) / gnuwin32 (windows) path — fallback for one
  # release per FINALIZATION.md's "Final" item, then removed. Kept at full
  # matrix parity with `build` above as the safety net during the
  # transition.
  build-legacy:
    name: legacy / ${{ matrix.os }} / ${{ matrix.env }}
    # Gated behind ENABLE_HOSTED_JOBS — see `build` job above for details.
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, full]
        include:
          # external optimized BLAS/LAPACK variant (linux only for now)
          - os: ubuntu-latest
            env: openblas
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: ${{ matrix.env }}
          cache: true
      - name: Build R
        run: pixi run -e ${{ matrix.env }} build-legacy
      - name: Smoke test
        run: pixi run -e ${{ matrix.env }} smoke-legacy
      - name: Package contract test (Rcpp, data.table, minqa + OpenMP)
        run: pixi run -e ${{ matrix.env }} contract-legacy
      - name: Regression suite
        run: pixi run -e ${{ matrix.env }} check-legacy
      # Standalone bundle: reuses this job's already-built objdir (cheap).
      # Only the default (slim) variant is packaged in CI for now — full/
      # openblas relocation is exercised manually, not automated yet.
      - name: Package + verify standalone bundle
        if: matrix.env == 'default'
        run: pixi run -e ${{ matrix.env }} verify-package-legacy

  # Windows builds via src/gnuwin32 driven by scripts/build-gnuwin32.sh
  # (zig cc MinGW target + conda-forge MinGW gfortran) — legacy fallback,
  # same one-release retirement plan as build-legacy above.
  # NB: slim==full on Windows (gnuwin32 has no slim switches), so only
  # the default environment is built.
  build-windows-legacy:
    name: windows-latest-legacy / default
    # Gated behind ENABLE_HOSTED_JOBS — see `build` job above for details.
    if: vars.ENABLE_HOSTED_JOBS == 'true'
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: default
          cache: true
      - name: Build R (gnuwin32 + zig)
        run: pixi run build-legacy
      - name: Smoke test
        run: pixi run smoke-legacy
      - name: Package contract test (Rcpp, data.table, minqa)
        run: pixi run contract-legacy
      - name: Regression suite
        run: pixi run check-legacy
      - name: Package + verify standalone bundle
        run: pixi run verify-package-legacy

  # conda-forge-style package (rattler-build) — always the slim variant
  # regardless of matrix.env above, since recipe/build.sh never sets
  # R_BUILD_VARIANT. A from-scratch build in its own isolated sandbox, so
  # it can't reuse the `build`/`build-windows` jobs' prefixes; this roughly
  # doubles total Windows CI time, which is the tradeoff for catching a
  # recipe regression before a real release instead of relying on a manual
  # omicron/kappa run. recipe/build.sh itself now drives zig-build.sh, not
  # the legacy autoconf/gnuwin32 scripts.
  conda-package:
    name: conda-package / ${{ matrix.name }}
    # Self-hosted runners on gamma/omicron/kappa — the same machines every
    # zig-build fix in this project was verified against, with persistent
    # caches and already-authenticated `rattler-build auth login` sessions
    # (no GitHub secrets needed for the publish step below). See
    # devdocs/feat-prefix-publish/CI_SELF_HOSTED_PLAN.md.
    runs-on: ${{ matrix.labels }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            labels: [self-hosted, linux]
          - name: macos
            labels: [self-hosted, macos]
          - name: windows
            labels: [self-hosted, windows]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
 
      - name: Build + test conda package
        run: |
          # pixi self-update --no-progress --no-release-note --quiet;
          # pixi --version;
          pixi run -e pkg conda-package;
      # rattler-build's own test phase runs with a literal unexpanded
      # %PREFIX% on PATH on Windows, so it can never exercise the
      # Library/bin/{R,Rscript}.bat shims a real install relies on (see
      # recipe/recipe.yaml's win test comment + scripts/stage.sh). This
      # is the regression check for that: a genuinely fresh pixi project
      # installing straight from the just-built local channel, invoking
      # bare `Rscript` the same way a real user would.
      - name: Fresh-env consume test (Windows PATH shim)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          set -euo pipefail;
          channel="$(cd dist/conda && pwd -W)";
          consume_dir="$(mktemp -d)";
          pixi init --channel "$channel" --channel conda-forge --platform win-64 "$consume_dir";
          cd "$consume_dir";
          pixi add r-zig-slim;
          pixi run Rscript -e 'r_home <- R.home(); cat("R_HOME =", r_home, "\n"); stopifnot(grepl("Library", r_home, fixed = TRUE)); cat("consume test OK\n")';
      - name: Publish to prefix.dev
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pixi run -e pkg conda-publish;

