[workspace]
authors = ["luciorq <luciorqueiroz@gmail.com>"]
# `universe` (prefix.dev, public) carries flang-pixi's zig-built Fortran
# toolchain (flang-zig / flang-rt-zig / lld-zig, LLVM 23.1.1) for every
# subdir: R's Fortran compiler on all of them (see [dependencies]).
# Listed after conda-forge: its package names never collide with
# conda-forge's, so priority is moot.
channels = ["conda-forge", "https://prefix.dev/universe"]
name = "r-zig-pixi"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

# Everything needed to build R comes from conda-forge through this manifest.
# No system compilers, no system shells, no system libraries.
# C/C++ toolchain: zig (zig cc / zig c++ / zig ar / zig ranlib) on every platform.
# Fortran: LLVM flang, flang-pixi's zig-built flang-zig + flang-rt-zig
#          (universe channel), on every platform. No gfortran anywhere.
#
# Two build variants, mapped to pixi environments:
#   default -> "slim": headless. cairo+png graphics, ICU, pcre2, libcurl,
#              compression, internal BLAS/LAPACK, R shlib. No X11/quartz/
#              tcltk/readline/NLS/jpeg/tiff, no recommended packages.
#   full    -> adds tcltk, readline, NLS, jpeg+tiff devices.
# Capabilities are baked at compile time, so these are separate configure
# runs (separate objdirs/prefixes), not just dependency toggles.

[activation.env]
R_VERSION = "4.6.1"

# The R build pipeline. A feature of its own (not [tasks]) so the
# no-default-feature `minimal` environment gets the very same tasks:
# a copy defined in [feature.minimal.tasks] made bare `pixi run build`
# ambiguous ("the task 'build' is ambiguous"), since pixi only
# resolves a task to the default environment when every environment
# offering it gets it from the same feature. Every build environment
# lists this feature in [environments] below.
# Dev and test runs compile packages against the dev tree, which is the
# tree that ships: its compilers (rzig) add the include/ and lib/ of the
# environment R is installed in, which for the dev tree is dist/R-*-zig,
# not this pixi env. R_ZIG_EXTRA_ENV names one more environment for rzig
# to add after it (feat-no-host-paths F3b, zigbuild/tools/rzig/
# environment.zig): the pixi env's headers and libraries, and an rpath
# into them (it is a conda env), as R installed into a conda env has
# them. rzig never reads CONDA_PREFIX itself; on Windows it appends
# /Library. Checks of the shipped tree alone run under env -i.
[feature.pipeline.activation.env]
R_ZIG_EXTRA_ENV = "$CONDA_PREFIX"

[feature.pipeline.target.win-64.activation.env]
R_ZIG_EXTRA_ENV = "%CONDA_PREFIX%"

[feature.pipeline.tasks]
fetch = "bash scripts/fetch-r.sh"
# Only build path: `zig build` alone (no autoconf, no make, no gnuwin32)
# — see .github/devdocs/feat-zig-build/. The autoconf/gnuwin32 pipeline
# was kept as an explicit "-legacy" fallback for one release past
# Milestone 5 (FINALIZATION.md's "Final" item), then retired — see
# Milestone 7 in feat-legacy-retirement/.
build = { cmd = "bash scripts/zig-build.sh", depends-on = ["fetch"] }
# Upstream zig (feat-no-host-paths F4): R builds with this env's zig
# (conda-forge's) and with upstream zig, the ziglang.org release, which
# PyPI's ziglang is. fetch-zig downloads PyPI's ziglang 0.16.0 wheel for
# this platform once (sha256 pinned in the script; no Python, it is a
# zip), unpacks it under build/zig-upstream/ and prints its zig's path.
# The tasks here honour ZIG_BIN, so with it they build and test with
# that zig:
#   ZIG_BIN="$(pixi run fetch-zig)" pixi run build   (then verify-tree, ...)
# PowerShell: $env:ZIG_BIN = pixi run fetch-zig. Each zig gets its own
# build/zig-cache/zig-<cksum>/ (scripts/env.sh). conda-package does not:
# rattler-build gives the recipe a clean environment, so the conda
# package builds with its build env's zig; nor does wheel-test, which
# compiles with the ziglang it installs.
fetch-zig = "bash scripts/fetch-zig.sh"
# R's regression suite (make check's Examples/Specific/Reg targets)
# against the installed tree, on every OS: R's own tests/Makefile on
# linux/macOS (build.zig addCheckStep), tests/Makefile.win on Windows
# (addCheckStepWindows, which lists what it leaves out and why). The
# tree's own libraries and Tcl/Tk: build put them in it (F1.7).
check = { cmd = "bash scripts/zig-build.sh check", depends-on = ["fetch"] }
# smoke/contract/install/package/verify-package all resolve the zig
# prefix themselves (mirroring zig-build.sh's own $FLAVOR-based prefix
# derivation) so callers don't need to know it.
smoke = "bash scripts/zig-smoke.sh"
# contract: CRAN packages compiled with the installed tree through its
# Makeconf (R CMD SHLIB/INSTALL: Rcpp, data.table, minqa + OpenMP), on
# every OS (Windows: etc/x64/Makeconf and R.exe's CMD dispatcher).
contract = "bash scripts/zig-contract.sh"
# `zig build` installs the final tree (feat-no-host-paths PLAN.md, F1);
# kept as an alias of build for existing commands.
install = { depends-on = ["build"] }
# Static checks of that installed tree, run right after build (F1.6):
# Makeconf, the compilers are rzig, no file of R's own naming the build
# machine, the CA bundle, rpaths, the glibc and macOS floors, the C++
# runtime, load commands, minimal's excluded libraries; Windows: Tcl/Tk
# and the DLL closure. Takes an optional tree path (`pixi run
# verify-tree -- <dir>`).
verify-tree = "bash scripts/verify-tree.sh"
# The standalone archive (dist/R-<ver>-<flavor>-<platform>.tar.gz, Windows
# .zip, plus its sha256): only archives the installed tree, which build
# made complete on every OS (F1.7: zig build installs the env's runtime
# data, vendor-libs.sh its shared libraries).
package = { cmd = "bash scripts/zig-package.sh", depends-on = ["install"] }
# The archive's own checks: extracted elsewhere, R and packages compiled
# with it run with nothing from the build env (unix: env -i, TLS with the
# shipped CA bundle; Windows: rzig's dry runs, and OpenMP C and Fortran
# packages built with the tree alone, loaded with PATH = bin\x64 +
# System32).
verify-package = { cmd = "bash scripts/zig-verify-package.sh", depends-on = ["package"] }
# Tier 0/1 with an empty environment and only the tree's own programs on
# PATH (unix: <tree>/bin, strace on linux; Windows: bin\x64 plus
# System32): start R, install without compiling. Runs on a copy of the
# installed tree, the tree that ships, so it needs no `package` first.
hermetic = "bash scripts/hermetic-check.sh"
# rzig, the compilers in R_HOME/bin/toolchain (zigbuild/tools/rzig/): its
# unit tests here, and on linux the parity test against the bash shims in
# toolchain/ for every OS's command lines. Needs no R build.
rzig-test = "bash zigbuild/tools/rzig/test.sh"
clean = "bash scripts/clean.sh"
# Not part of the build path (zig-build.sh never calls this) — exists
# solely so zigbuild/tools/gen-subst.sh has a config.status to replay
# when regenerating a vendored zigbuild/config/<plat>-<variant>/subst.txt
# (see PLAN.md's "Regenerating the vendored config"). Deliberately does
# NOT apply the R-source patches scripts/zig-build.sh already owns.
configure = { cmd = "bash zigbuild/tools/configure-only.sh", depends-on = ["fetch"] }

[tasks]
# --- CI (build-r.yml on GitHub Actions; needs `gh auth login`) ---
# The full tier on demand, on main: all 15 legs and conda-package on all
# 5, which publishes, as a push to main does (a push runs only the core
# tier's 6 legs; .github/devdocs/chore-ci-tiers/PLAN.md). For a branch:
# `gh workflow run build.yaml --ref <branch>`; for a pull request, the
# `full-ci` label.
ci-trigger = "gh workflow run build.yaml --ref main"
# Re-run only the jobs that failed in the most recent build-r run (e.g.
# just conda-package/windows) without re-running everything that already
# passed. `gh run rerun --job <id>` reruns one specific job by its
# databaseId if you need an exact target instead — see `gh run view
# <run-id> --json jobs --jq '.jobs[] | {name, databaseId}'`.
ci-rerun-failed = "gh run rerun --failed $(gh run list --workflow=build.yaml --limit 1 --json databaseId --jq '.[0].databaseId')"

[dependencies]
# --- toolchain ---
zig = "0.16.*"
make = ">=4.4"
pkg-config = "*"
# Fortran: flang-pixi's zig-built LLVM flang (23.1.1, `universe`) on every
# platform, one runtime model everywhere. Why flang-zig and no other
# flang: on osx-arm64 gfortran silently miscompiles R's complex LAPACK
# (zgesdd) at -O2; conda-forge has no flang for macOS or linux-aarch64,
# and its win-64 flang targets MSVC, which R's MinGW build cannot link;
# on linux-64 (conda-forge's flang until 2026-10-03) conda-forge's
# llvm-openmp ships no omp_lib.mod, so `use omp_lib` failed there, and
# its flang-rt ships a shared runtime with default visibility.
# build.zig requires it: without $CONDA/bin/flang the build stops.
# ~1.5 GiB closure (flang-zig + lld-zig + flang-rt-zig).
# Pinned to flang-pixi's 2026-10-07 release, one build number per package
# on every platform, built with zig 0.16.0: flang-zig 6, lld-zig 5,
# flang-rt-zig 10. Its zig 0.17 builds will come at the next numbers
# (7, 6, 11), so the pins keep us on the 0.16 builds until we move on
# purpose. ==N, not >=N,<N+1: pixi 0.81 takes one comparison per
# build-number (a range is a parse error), and for an integer it is the
# same. lld-zig is listed for its pin only: flang-zig accepts any lld-zig
# 23.1.1 build.
flang-zig = { version = "==23.1.1", build-number = "==6" }
lld-zig = { version = "==23.1.1", build-number = "==5" }
# flang-rt-zig 10: static-only (no .so/.dylib) and built with hidden
# visibility on every platform, so a Fortran package exports only its own
# symbols instead of re-exporting the whole runtime (~830 on macOS, ~1,240
# on linux) and -lflang_rt.runtime can only mean the archive. Also ships
# omp_lib.mod (`use omp_lib`); it requires llvm-openmp >= 23 (below).
flang-rt-zig = { version = "==23.1.1", build-number = "==10" }
# --- portable userland (fetch/extract tools; coreutils are per-target below) ---
curl = "*"
# --- core libraries R links against (slim profile) ---
zlib = "*"
bzip2 = "*"
xz = "*"
liblzma-devel = "*"
pcre2 = "*"
libcurl = "*"
icu = "*"
tzdata = "*"
libdeflate = "*"  # faster lazyload compression; was only transitive via libtiff
# OpenMP: zig cc does -fopenmp codegen but ships no libomp or omp.h, so
# conda-forge's LLVM libomp, on every platform: R (unix) and packages
# link it, never libgomp (which libgcc still brings into the linux and
# win-64 envs). 23: the LLVM major of flang-zig/flang-rt-zig, whose
# omp_lib.mod `use omp_lib` compiles against, so every platform builds
# and tests with one libomp release. Unpinned, the lock kept 22.1.8 on
# unix by inertia while win-64 needed 23.1.1 (flang-rt-zig build 4).
# recipe/recipe.yaml pins the same in host only: a newer libomp runs
# code built against an older one, so r-zig-slim's run dependency has no
# upper bound.
llvm-openmp = "23.*"
# --- headless graphics: cairo + png only in slim ---
cairo = "*"
expat = "*"
# pango/harfbuzz pinned to the lockfile's current generation: a fresh solve
# (flang-zig-validation worktree, 2026-09-19) pulled pango 1.58 + the split
# libharfbuzz 14.3, which break R 4.6.1's cairo device compile (hb.h
# include churn). Independent of any toolchain choice; lift the pin only
# together with a fix on the R side (or a newer R). harfbuzz is not a
# direct dependency otherwise — listed only to hold its version.
pango = "1.56.*"
harfbuzz = "14.2.*"
fontconfig = "*"
freetype = "*"
libpng = "*"
# glib, not libglib alone (2026-10-08, glib 2.90.0): R's cairo device
# compiles against pango's headers, which include glibconfig.h, and only
# glib ships it (lib/glib-2.0/include). R links -lgobject-2.0 -lglib-2.0,
# and the unversioned libraries those name are in glib-tools, which glib
# brings; libglib has only the versioned ones. glib needs python, so
# python is in R's build envs on unix. On win-64 harfbuzz's
# libharfbuzz-devel needs glib anyway.
glib = "*"

# conda-forge's linux cairo is built with X11 backends; its pkg-config
# metadata needs the xorg proto files even though R is built --with-x=no
[target.linux.dependencies]
xorg-xorgproto = "*"

# Shell + GNU text tools for running autoconf configure (all from conda-forge)
[target.unix.dependencies]
bash = "*"
which = "*"
sed = "*"
grep = "*"
gawk = "*"
tar = "*"
gzip = "*"
unzip = "*"
zip = "*"
patch = "*"  # zig-build.sh applies zigbuild/patches/ (m2-patch on win-64)

# Rust coreutils everywhere conda-forge ships them; GNU coreutils on linux-aarch64.
[target.linux-64.dependencies]
uutils-coreutils = "*"
patchelf = "*"  # rpath rewriting for relocatable installs
# objdump (verify-tree.sh's glibc ceiling) and strip (vendor-libs.sh,
# minimal) from conda-forge, not the host. Puts bare ld/as/ar/nm on PATH
# too; nothing calls them: zig links in-process, flang with ld.lld
# (flang-zig's flang.cfg: -fuse-ld=lld), rzig's ar is `zig ar`.
binutils = "*"
# strace (hermetic-check.sh's and verify-bundle.sh's traces) from
# conda-forge, not the host: in CI those checks fail without it.
strace = "*"

# win-64: flang-zig is the MinGW-ABI flang (see [dependencies]); it
# replaced conda-forge's MinGW gfortran (gcc_impl_win-64), Phase 2,
# platform 2. binutils_impl_win-64 used to arrive through gfortran and
# is what provides the x86_64-w64-mingw32-nm/-dlltool that build.zig's
# import-stub steps call; keep it explicitly.
[target.win-64.dependencies]
binutils_impl_win-64 = "*"
uutils-coreutils = "*"
# gnuwin32 has no slim switches: Windows R unconditionally builds the
# bitmap devices (jpeg/tiff) and the tcltk package, so slim-on-Windows
# carries these (parity caveat, tracked in TODO.md)
libjpeg-turbo = "*"
libtiff = "*"
# Tcl/Tk 8.6: tcltk.dll links tcl86t/tk86t (WIN_TCLTK_LIBS) and R_HOME/Tcl
# is 8.6's layout (build.zig installEnvRuntime); conda-forge's tk 9.0 has
# other names (tcl90.dll, tcl9tk90.dll). recipe/recipe.yaml pins the same.
tk = "8.6.*"
gettext = "*"
m2-bash = "*"
m2-make = "*"
m2-coreutils = "*"
m2-diffutils = "*"
m2-findutils = "*"
m2-texinfo = "*"  # gnuwin32 'make all' builds R-FAQ.html unconditionally
m2-which = "*"
m2-tar = "*"
m2-gzip = "*"
m2-sed = "*"
m2-grep = "*"
m2-gawk = "*"
m2-unzip = "*"
m2-zip = "*"
m2-patch = "*"  # zig-build.sh applies zigbuild/patches/; conda-forge has no win-64 `patch`

[target.osx-64.dependencies]
uutils-coreutils = "*"

[target.osx-arm64.dependencies]
uutils-coreutils = "*"

# linux-aarch64: flang-pixi cross-builds its flang-zig from linux-64 and
# smoke-tests it on the hosted arm runner, which is also the only
# hardware r-zig-pixi has for it (configs captured by gen-config.yaml's
# ubuntu-24.04-arm legs, validated by build.yaml's).
[target.linux-aarch64.dependencies]
coreutils = "*"
patchelf = "*"
binutils = "*"  # binutils and strace: see linux-64
strace = "*"

# --- optional capabilities (compile-time: only via the 'full' environment) ---

[feature.tcltk.dependencies]
# 8.6: the vendored config links -ltcl8.6 -ltk8.6, and the tree ships
# lib/tcl8.6 (build.zig installEnvRuntime); see win-64 above.
tk = "8.6.*"

[feature.img-formats.dependencies]
libjpeg-turbo = "*"
libtiff = "*"

[feature.repl.target.unix.dependencies]
readline = "*"
ncurses = "*"

[feature.nls.target.unix.dependencies]
gettext = "*"

# Selects the "full" configure profile in scripts/configure-r.sh
[feature.full-build.activation.env]
R_BUILD_VARIANT = "full"

# External optimized BLAS/LAPACK instead of R's internal reference
# implementation (unix configure path only so far; gnuwin32 is TODO).
# Numerical results may differ in last-bit rounding from the reference
# BLAS — that is inherent to optimized BLAS, not a build defect.
[feature.openblas.dependencies]
openblas = "*"

[feature.openblas.activation.env]
R_BLAS = "openblas"

# --- "minimal": the Python-wheel variant ------------------------------------
# Smaller than slim: no cairo/png (so no pango/harfbuzz/fontconfig/freetype/
# glib/X11 closure) and no ICU (collation falls back to the C library). It
# also drops OpenMP, because libomp inside a Python process conflicts with
# the libgomp/libomp that numpy/scipy/torch wheels bring. libdeflate is
# dropped too (lazy-load compression falls back to zlib). What remains is
# only what R's configure requires: pcre2, libcurl, zlib/bzip2/xz (plus
# libiconv, see below). pdf()/postscript() still work;
# png()/svg()/cairo_pdf() do not.
#
# ICU still reaches the wheel, but only through libcurl: conda-forge's
# libcurl >= 8.21 (2026-08-19) links libpsl, which is always built with
# ICU, which needs libstdc++. That is 14 of the wheel's ~49 MiB. Pinning
# `libcurl = "<8.21"` below would drop it, at the cost of an older curl
# (8.20.0 is from 2026-04-29). Left unpinned on purpose: that is a
# security-vs-size call. verify-tree.sh reports these libraries and
# fails only if R's own binaries link them.
#
# What guarantees the profile is configure-only.sh's explicit --without-*/
# --disable-* switches: the toolchain's own closure still drags icu and
# libiconv (conda-forge zig's LLVM, through libxml2) and llvm-openmp
# (flang-rt-zig) into this env. It is its own environment with
# no-default-feature anyway, not a feature layered on top of default, so
# the graphics stack is not even installed and the CI download is
# smaller. The cost is that the toolchain lines below duplicate
# [dependencies] (Fortran included) and the per-target coreutils
# sections: keep them in sync. (The tasks are shared through
# [feature.pipeline.tasks].)
# Unix only: gnuwin32 has no switches for any of this (Windows is always
# full, see build.zig).
#
# The wheel itself (r-zig, built by `pixi run -e wheel wheel`) wraps
# this variant's standalone tree. Its runtime compiler for
# install.packages() is the PyPI `ziglang` package (same zig version as
# this env's, 0.16.0), declared as a wheel dependency.
[feature.minimal]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.minimal.activation.env]
R_VERSION = "4.6.1"
R_BUILD_VARIANT = "minimal"

[feature.minimal.dependencies]
zig = "0.16.*"
make = ">=4.4"
pkg-config = "*"
curl = "*"
zlib = "*"
bzip2 = "*"
xz = "*"
liblzma-devel = "*"
pcre2 = "*"
libcurl = "*"
bash = "*"
which = "*"
sed = "*"
grep = "*"
gawk = "*"
tar = "*"
gzip = "*"
unzip = "*"
zip = "*"
patch = "*"
flang-zig = { version = "==23.1.1", build-number = "==6" }  # pins: see [dependencies]
lld-zig = { version = "==23.1.1", build-number = "==5" }
flang-rt-zig = { version = "==23.1.1", build-number = "==10" }

[feature.minimal.target.linux-64.dependencies]
uutils-coreutils = "*"
patchelf = "*"
binutils = "*"
strace = "*"

[feature.minimal.target.linux-aarch64.dependencies]
coreutils = "*"
patchelf = "*"
binutils = "*"
strace = "*"

[feature.minimal.target.osx-64.dependencies]
uutils-coreutils = "*"

[feature.minimal.target.osx-arm64.dependencies]
uutils-coreutils = "*"

# minimal's packages in pixi.lock, all four platforms, against
# scripts/minimal-deny.txt (the graphics stack, glib, python, ...). Reads
# the lock only. Run it after every re-lock; CI runs it on the minimal
# legs (build-r.yaml).
[feature.minimal.tasks]
minimal-check = "bash scripts/check-minimal.sh"

# Wheel assembly + test: only Python (stdlib zipfile/hashlib, venv, pip).
# Not the build env: python's own closure (readline, tk, sqlite, ...)
# has no business being visible to R's configure. The input is the
# minimal build's installed, vendored tree (`pixi run -e minimal build`);
# R_BUILD_VARIANT is set here too so env.sh derives the same
# dist/R-<ver>-minimal-zig prefix.
[feature.wheel]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[feature.wheel.activation.env]
R_VERSION = "4.6.1"
R_BUILD_VARIANT = "minimal"

[feature.wheel.dependencies]
python = ">=3.9"

# readelf (wheel-test.sh's C++ runtime and rpath checks) from conda-forge,
# not the host; macOS uses otool there.
[feature.wheel.target.linux.dependencies]
binutils = "*"

[feature.wheel.tasks]
wheel = "python scripts/make-wheel.py"
# Installs the wheel plus ziglang (from PyPI: needs network) into a
# throwaway venv and runs it with the pixi env scrubbed from the
# environment, including an R CMD INSTALL of a C package through ziglang.
wheel-test = "bash scripts/wheel-test.sh"

# conda packaging (rattler-build) lives in its own environment.
# curl/python: used by the conda-channel-list/-delete admin scripts
# (scripts/prefix-*.sh) — declared here so the pkg env is self-contained
# rather than borrowing whatever the host machine happens to have.
[feature.pkg.dependencies]
rattler-build = ">=0.76"  # --error-overlapping-files, --error-unused-staging-files (0.76.0)
curl = "*"
python = ">=3.9"

[feature.pkg.tasks]
# --no-build-id: drops the "_<timestamp>" suffix from rattler-build's own
# bld/rattler-build_<pkg>_<id>/work directory name. Purely a path-length
# optimization for Windows (see devdocs/feat-prefix-publish/
# CI_SELF_HOSTED_PLAN.md) — dlltool mangles the full absolute path of
# each generated import lib into a single flat temp filename, and that
# combined length blew past Windows' 260-char MAX_PATH once nested under
# the self-hosted runner's own _work directory. Harmless on linux/macOS
# (never hit the bug there; just a slightly simpler directory name).
# -c: rattler-build does not read the workspace channels; `universe` is
# where flang-zig/flang-rt-zig (osx-arm64 Fortran) come from.
# rm: rattler-build restores the staging output (the R build) from
# dist/conda/build_cache under a key that does not hash the recipe's
# `path:` sources (scripts/, zigbuild/, build.zig), so a local rebuild
# after editing them silently reused the old build (2026-09-30).
# --error-*: two outputs packaging the same file, or a staging file no
# output takes, fail the build instead of warning (no 0.76.1 build of
# ours has warned).
conda-package = "rm -rf dist/conda/build_cache && rattler-build build --recipe recipe/recipe.yaml --output-dir dist/conda --no-build-id --error-overlapping-files --error-unused-staging-files -c conda-forge -c https://prefix.dev/universe"

# Channel administration: list/delete published package files. Neither
# rattler-build nor pixi has CLI support for either operation (upload-
# only); prefix.dev's own dashboard has no delete button by design (to
# discourage casual deletion) but the real DELETE API still exists and
# is documented — see scripts/prefix-delete-package.sh's own header
# comment for the full rationale, auth requirements, and safety notes
# (dry-run by default, needs a separately-scoped PREFIX_API_KEY, not the
# upload credential `rattler-build auth login` already stores).
# Usage: pixi run -e pkg conda-channel-list universe linux-64
conda-channel-list = "bash scripts/prefix-list-packages.sh"
# Usage: pixi run -e pkg conda-channel-delete -- --yes universe linux-64 <file.conda> [<file.conda> ...]
conda-channel-delete = "bash scripts/prefix-delete-package.sh"

# Interim publish path: upload from an already-authenticated dev machine
# (`rattler-build auth login prefix.dev`). Not chained onto conda-package
# via depends-on — publishing an already-built artifact shouldn't force a
# full R rebuild. See PLAN.md for the CI/trusted-publishing end goal.
# Scoped per-platform (rather than one task globbing dist/conda/*/*.conda)
# so it can never pick up another platform's artifact or anything left in
# rattler-build's own dist/conda/broken/ (its convention for a package
# that failed its test phase) — each dev machine only ever builds its own
# platform, so this is exact, not just defensive.
[feature.pkg.target.linux-64.tasks]
conda-publish = "rattler-build upload prefix --channel universe --skip-existing dist/conda/linux-64/*.conda"

[feature.pkg.target.osx-64.tasks]
conda-publish = "rattler-build upload prefix --channel universe --skip-existing dist/conda/osx-64/*.conda"

[feature.pkg.target.osx-arm64.tasks]
conda-publish = "rattler-build upload prefix --channel universe --skip-existing dist/conda/osx-arm64/*.conda"

[feature.pkg.target.win-64.tasks]
conda-publish = "rattler-build upload prefix --channel universe --skip-existing dist/conda/win-64/*.conda"

# linux-aarch64 became a real platform when the repo went public
# (GitHub-hosted ubuntu-24.04-arm runners): CI's conda-package-hosted
# job builds and publishes through this task via OIDC trusted
# publishing. Its vendored config lives at zigbuild/config/linux-arm64-*
# ("arm64", not conda's "aarch64" — build.zig/gen-subst.sh's shared
# pre-existing dir-naming convention, see Arch.condaForgeSuffix).
[feature.pkg.target.linux-aarch64.tasks]
conda-publish = "rattler-build upload prefix --channel universe --skip-existing dist/conda/linux-aarch64/*.conda"

# The R environments are one solve group, "r": pixi solves them together,
# per platform, so a package they share is the same version and build in
# all of them, while each still installs only what its own dependencies
# reach (pixi's manifest reference, [environments]: "the different
# environments contain different subsets of the solve-groups dependencies
# set"). Solved apart, each kept what its own last solve had picked:
# zig_impl 0.16.0 _15 in default against _19 in minimal, libomp 22.1.8
# against 23.1.2 until the 23.* pin. The group aligns them without
# pinning a build number (consolidation PLAN.md, convention 2).
# The group adds no other environment's specs, but the one build it keeps
# of a shared package brings that build's own dependencies, so an
# environment can still gain packages. In this lock (2026-10-06, compared
# with solving each apart) minimal gained none; on linux, full and
# full-openblas kept gawk 5.4.1 and with it gmp and mpfr, which the other
# R envs already had. A re-lock that keeps an older build can add more:
# `pixi lock` with the old lock's preferences kept default's pkg-config
# _1009, which brought libglib and libffi (linux-aarch64, osx-arm64) and
# libgcc-ng and libstdcxx-ng (linux) into minimal. After a re-lock, run
# `pixi run -e minimal minimal-check` (scripts/minimal-deny.txt; CI runs
# it too); verify-tree checks only what R links. minimal has no win-64,
# so the group's win-64 solve leaves minimal's features out. wheel stays
# out: it is Python-only and nothing in it builds or links R, and in the
# group its python (libpython needs libcxx >= 20) would share versions
# with R's build envs, where zig holds libcxx at 21.* on macOS.
[environments]
pkg = { features = ["pkg", "pipeline"], solve-group = "r" }
default = { features = ["pipeline"], solve-group = "r" }
full = { features = ["tcltk", "img-formats", "repl", "nls", "full-build", "pipeline"], solve-group = "r" }
openblas = { features = ["openblas", "pipeline"], solve-group = "r" }
full-openblas = { features = ["tcltk", "img-formats", "repl", "nls", "full-build", "openblas", "pipeline"], solve-group = "r" }
minimal = { features = ["minimal", "pipeline"], no-default-feature = true, solve-group = "r" }
wheel = { features = ["wheel"], no-default-feature = true }
