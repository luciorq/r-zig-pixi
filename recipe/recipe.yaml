context:
  version: "4.6.2"
  # R's recommended packages (share/make/vars.mk's R_PKGS_RECOMMENDED),
  # as one glob: r-zig-recommended's files, which r-zig-slim leaves out
  # (feat-recommended-packages PLAN.md). zigbuild/recommended/ reads the
  # list from R's source; test-recommended.R holds the package to R's own
  # list, so a name missing here fails there.
  recommended: "{MASS,lattice,Matrix,nlme,survival,boot,cluster,codetools,foreign,KernSmooth,rpart,class,nnet,spatial,mgcv}"

recipe:
  name: r-zig
  version: ${{ version }}

source:
  # R sources from CRAN plus this repo's build scripts — the recipe is a
  # consumer of the same scripts pixi tasks use. The compilers in
  # R_HOME/bin/toolchain are rzig (zigbuild/tools/rzig/), built by zig
  # build; the bash shims in toolchain/ only serve configure-only.sh.
  # CRAN, then its CDN, as scripts/fetch-r.sh: rattler-build tries each
  # url in turn (CRAN failed CI legs on 2026-11-11), against the one sha256.
  - url:
      - https://cran.r-project.org/src/base/R-4/R-${{ version }}.tar.gz
      - https://cloud.r-project.org/src/base/R-4/R-${{ version }}.tar.gz
    sha256: c297040f6392b1dac6e5c0eb398422cfdaedf540ae2205edb9ad0d10cb10ee00
    target_directory: R-src
  - path: ../scripts
    target_directory: scripts
  # build.zig/zigbuild/: scripts/zig-build.sh's own build system (recipe/
  # build.sh drives it since Milestone 5's default-path swap), and
  # zigbuild/toolchain/, the toolchain build build.sh runs after it
  # (scripts/zig-toolchain.sh; feat-standalone-toolchain B30). Without
  # these explicitly listed, a local `rattler-build build` still
  # "succeeds" — `zig build` walks UP parent directories looking for
  # build.zig when it's missing from the sandbox's own work dir, and
  # rattler-build's local output-dir (dist/conda/bld/.../work/) happens
  # to sit inside this same checkout, so it silently finds the REAL
  # project's build.zig several levels up instead of the sandboxed copy
  # (found by inspecting the kept work dir directly via `rattler-build
  # build --keep-build` — it genuinely had no build.zig/zigbuild/ at all).
  # That accidental behavior wouldn't survive the recipe/build.sh
  # source being built anywhere other than nested inside this exact
  # checkout (e.g. a standalone feedstock-style recipe repo) — vendor
  # them explicitly instead of relying on it.
  - path: ../build.zig
    target_directory: .
  - path: ../zigbuild
    target_directory: zigbuild
  # Windows: pkgconf's source, which the toolchain build compiles into
  # R_HOME/bin/toolchain/usr/bin as pkgconf.exe and pkg-config.exe
  # (zigbuild/toolchain/pkgconf.zig; recipe/build.sh passes the directory
  # as -Dpkgconf). The url and sha256 are pkgconf.zig's, as its test
  # checks (pixi run toolchain-test); the standalone build fetches the
  # same tarball (zigbuild/toolchain/build.zig.zon).
  - if: win
    then:
      - url: https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.11.tar.xz
        sha256: d0cd841bc8e55b9da888106c00dc256d05b7d1d8e5a46f4be4eb4c5125bd2dc4
        target_directory: pkgconf-src
  # Windows: cairo's source, which R's build compiles and links statically
  # into winCairo.dll (zigbuild/cairo.zig; recipe/build.sh passes the
  # directory as -Dcairo). conda-forge has no win-arm64 cairo; one build
  # keeps both Windows arches alike. The url and sha256 are cairo.zig's,
  # as its test checks (pixi run toolchain-test); the standalone build
  # fetches the same tarball (build.zig.zon).
  - if: win
    then:
      - url: https://cairographics.org/releases/cairo-1.18.6.tar.xz
        sha256: 1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4
        target_directory: cairo-src

build:
  # 2: first zig-built release (recipe/build.sh switched from configure-
  # r.sh/build-r.sh/install-r.sh to zig-build.sh + stage.sh, Milestone 5's
  # default-path swap; also past 1, a Windows-only build already
  # released). 3: Windows-only follow-up — Rcmd.exe/config.sh/
  # Rcmd_environ fixes (F7.1, see feat-zig-build/TODO.md) for a real user-
  # reported install.packages() failure. 4: Windows-only follow-up — the
  # gcc.exe/g++.exe forwarder's baked-in bash.exe/zig-cc paths pointed into
  # the (torn-down) build sandbox, and m2-bash wasn't a run: dependency at
  # all, so package compilation was silently broken on every real install
  # (see build.zig's win-exec-forward.c rewrite). 5: all 3 platforms —
  # default user package library (R_LIBS_USER) now differentiated from any
  # other R install: XDG base dir spec on Linux/macOS
  # (~/.local/share/R/<platform>-zig/<x.y>, respects $XDG_DATA_HOME),
  # LOCALAPPDATA/R/win-64-zig/<x.y> on Windows (unchanged, already the
  # right semantic equivalent) — requested directly, not a bug (F7.3, see
  # feat-zig-build/TODO.md). 6: Windows-only follow-up — m2-sed/m2-grep/
  # m2-gawk/m2-coreutils/m2-make/m2-which/m2-findutils added to run: (only
  # m2-bash was there before); real packages' own configure scripts need
  # them, found via a real `install.packages("pak")` failure (F7.1
  # follow-up, see feat-zig-build/TODO.md). 7: Windows-only follow-up —
  # the real root cause behind F7.1's recursive-configure access
  # violation (0xC0000005 in R.dll, deterministic, 5/5 reproductions):
  # a ReleaseFast-specific Zig/MinGW codegen issue on the windows-gnu
  # target (likely TLS-access lowering) — .Debug and .ReleaseSafe both
  # avoid it entirely, .ReleaseFast crashes every time on identical
  # source. build.zig's newCMod now builds Windows with .ReleaseSafe
  # instead of .ReleaseFast (Linux/macOS unchanged — never observed
  # there); see F7.6 in feat-zig-build/TODO.md for the full root-cause
  # writeup and verification (smoke + contract both pass, no
  # regression). 8: win-64 + osx-arm64 (linux-64 untouched, stays at 5) —
  # F7.7: win-exec-forward.c's _spawnv-based command-line construction
  # silently stripped embedded double-quote characters from -D flag
  # values (any package quoting a string literal that way, not just one
  # package); F7.8: OBJC was never routed through the zig-cc toolchain
  # shim on macOS (only OBJCXX was, by an autoconf fallback accident),
  # so any package with real Objective-C source silently compiled as
  # plain C. Both found and fixed while adding `pak` (a package that
  # exercises both) to contract-test.sh; see F7.7/F7.8 in
  # feat-zig-build/TODO.md. 9: no functional change — bumped solely to
  # force a fresh publish while testing the self-hosted CI pipeline
  # itself (see feat-prefix-publish/CI_SELF_HOSTED_PLAN.md).
  #
  # Version-bump policy (decided 2026-08-06, see feat-prefix-publish/
  # TODO.md's "End goal" section): stays fully manual — bump this number
  # as a deliberate part of any PR that should trigger a republish, same
  # as every prior bump above. `--skip-existing` on the publish task is
  # the safety net for CI runs that don't include one (same version+
  # build already on the channel is silently skipped, not an error).
  #
  # Reset 9 → 1 (2026-08-07, see feat-prefix-publish/CHANNEL_CLEANUP.md):
  # the `universe` channel is going public, and the messy build-number
  # history above (builds 0/1 from the retired autoconf/gnuwin32
  # pipeline, per-platform numbers that never lined up — win-64 topped
  # out at 8 while linux-64/osx-arm64 reached 9) isn't something a new
  # public consumer should have to understand just to `pixi add
  # r-zig-slim`. All 18 previously-published packages across all 3
  # platforms were deleted first (CHANNEL_CLEANUP.md's own inventory),
  # via prefix.dev's REST delete API — the dashboard deliberately has no
  # delete button; use scripts/prefix-delete-package.sh / the
  # conda-channel-delete pixi task if deletion is ever needed again.
  # This reset doesn't collide with anything already on the channel, and
  # is a one-time reset tied to going public, not a new precedent — the
  # manual-bump policy above is unaffected and still governs every
  # future change.
  # 1 → 2 (2026-09-20): Phase 2 shipped LLVM flang for every platform's
  # Fortran (flang-zig on osx-arm64/osx-64/win-64/linux-aarch64), but the
  # build string did not change and `--skip-existing` silently kept the
  # gfortran-built files on the channel through three "successful"
  # publish runs — the channel's osx-arm64/win-64 files were still the
  # 2026-08-15 uploads. A Fortran-runtime swap in run: deps is exactly
  # the kind of change this policy says must bump.
  # 2 → 3 (2026-09-25): the zig-cc/zig-cxx shims shipped in R_HOME/bin/
  # toolchain changed — macOS drops repeated -l<name> (quadprog's
  # "duplicate linked dylib" on flang's runtime), and every shim now falls
  # back to `python3 -m ziglang` — plus package-standalone.sh's whole-token
  # Makeconf stripping. Package-compilation behavior on the channel only
  # changes if these files are republished.
  # 3 → 4 (2026-09-30): split into r-zig-slim (R) and r-zig-toolchain
  # (lib/R/bin/toolchain plus the compiler run dependencies), phase T of
  # feat-no-host-paths; libc++ static everywhere; FLIBS names the static
  # flang runtime. linux-64's Fortran moved from conda-forge's flang to
  # flang-zig (2026-10-03) before build 4 was published, so it rides here.
  # 4 → 5 (2026-10-06): rzig, the compilers r-zig-toolchain ships in
  # R_HOME/bin/toolchain, passes -mcpu=baseline on every OS. Build 4 (on
  # universe for all five subdirs) compiles Windows packages for the
  # compiling machine's own CPU (zig cc has no -target there, so a native
  # CPU: target-cpu "skylake" on kappa), which another machine's CPU may
  # lack; linux and macOS were already baseline through their -target.
  # (fix-rzig-baseline-cpu PLAN.md)
  # 5 → 6 (2026-10-08): rzig links flang's runtime for a package's
  # -lgfortran/-lquadmath on every OS (Windows asked a gfortran on PATH;
  # elsewhere the link failed or the package did not load), and on
  # Windows makes -lsynchronization (Rust-based packages) link with
  # upstream zig; win-64's Makeconf says TCL_VERSION = 86t, the names of
  # conda-forge's Tcl/Tk (tcl86t, tk86t), so packages that link Tcl/Tk
  # through TCLTK_LIBS (tkrplot) link (fix-rzig-follow-ups PLAN.md).
  # 6 → 7 (2026-10-08): the stress suite's round 1 (feat-stress-suite
  # stress/results/2026-10-08.md; fix-stress-round1 PLAN.md). rzig works
  # around zig 0.16's behaviours that broke CRAN packages (S1-S11). The
  # Windows tree takes CRAN's layout (S13-S15): Makeconf's R_ARCH = /x64
  # and COMPILED_BY, R_HOME/bin/R.exe and Rscript.exe, CC and CXX named
  # with .exe, and etc/Rcmd_environ sets CMake's generator and windres.
  # libdeflate <1.26 in host, so r-zig-slim shares a conda env with
  # conda-forge's GDAL (S19).
  # 7 → 8 (2026-10-10): no build-machine leftovers (fix-no-build-leftovers
  # PLAN.md). R's own linux binaries carry no debug info, in every
  # variant, as macOS's already did (libR.so 11.8 → 3.5 MB). The base
  # packages' help databases, help/paths.rds, doc/NEWS*.rds and code
  # databases name no build path: build 7's named rattler's work dir and
  # host prefix inside their compressed objects, which conda's prefix
  # replacement cannot reach.
  # 8 → 9 (2026-10-20, with feat-standalone-toolchain phase 7's merge;
  # universe's newest was _8 on all five subdirs): phases 4 to 7, which
  # kept 8 and published nothing (build.yaml's CONDA_PUBLISH, the user's
  # decision of 2026-10-19; B14 a). Phase 4 split the toolchain into
  # r-zig-compilers and r-zig-build-tools (r-zig-toolchain their
  # metapackage) and ships rzig with R on every channel; R CMD INSTALL
  # and R CMD SHLIB build through rzig build where they can
  # (feat-shlib-rzig-build); the standalone compilers group carries zig
  # (phase 5) and flang (phase 6); the standalone build-tools group
  # carries MSYS2's tools on Windows, R CMD config names the missing build
  # tools, R on win-64 puts the build tools first on PATH, in sessions
  # too, then its env's MSYS (Library/usr/bin), and R CMD check finds nm
  # (phase 7). The Windows front-ends embed R's UTF-8 manifest
  # (fix-r-utf8-manifest, merged before phase 7, which kept 8 too).
  # feat-win-link-fixes, merged after phase 7 and before the publish, rides
  # on 9 too: rzig build's links name their objects in a response file
  # (Windows packages of a few hundred objects linked past 32,767
  # characters), Windows package DLLs link ws2_32 by default, and the
  # build tools carry patch (feat-win-link-fixes PLAN.md).
  # 9 → 10 (2026-11-08, feat-standalone-toolchain phase 9; universe's
  # newest is _9 on all five subdirs): `_9` was built from #35's merge
  # (build.yaml dispatch 41942729382), so what merged after it publishes
  # here. rzig runs tier 1 itself, with no zig build runner
  # (feat-tier1-engine, #36); R_HOME/bin/toolchain carries rzig's link
  # objects, dso_fini.o (linux) and cfguard.o (x86_64 Windows), built
  # once with R (feat-r-home-link-objects, #37); the unix launchers no
  # longer set FONTCONFIG_PATH, which conda's fontconfig never needed:
  # its default is the env's etc/fonts (feat-standalone-toolchain phase
  # 8, #42). #38, #39 (verify-bundle.sh) and #40 (the icu floor, `icu
  # 78.*`) merged in that window too but change no package.
  # 10 → 11 (2026-11-09; universe's newest is _10 on all five subdirs):
  # win-64's pkg-config is pkgconf (3.0.10; 3.0.11 since 2026-11-15),
  # which the toolchain build compiles from source with zig into
  # R_HOME/bin/toolchain/usr/bin as pkgconf.exe and pkg-config.exe, on
  # both channels (r-zig-build-tools owns it here); conda-forge's
  # pkg-config 0.29.2, which printed Libs.private without --static
  # (ncdf4, RPostgres), and its glib DLLs are gone, from the standalone
  # tree and from r-zig-build-tools' run deps. etc/Rcmd_environ gives
  # PKG_CONFIG_PATH a default, R's env's Library/lib/pkgconfig and
  # Library/share/pkgconfig, which that package's activation used to set
  # (feat-zig-pkgconf). Zig 0.17 on every platform (feat-zig-017):
  # conda-forge's zig 0.17.0 (0.17.1 on conda-forge since 2026-11-12, in
  # the lock since 2026-11-15), flang-pixi's zig 0.17 builds (flang-zig
  # 7, lld-zig 6, flang-rt-zig 11); r-zig-slim's run_constraints and
  # r-zig-compilers' depends move to zig 0.17.*.
  # win-64's binutils are rzig's (nm, objdump, strip, dlltool, windres,
  # as beside gcc.exe in R_HOME/bin/toolchain, owned by r-zig-slim), on
  # zig 0.17's dlltool and rc: binutils_impl_win-64 and binutils/ are
  # gone (feat-win-zig-binutils). Windows' winCairo.dll links cairo
  # 1.18.6, built from source by R's build (zigbuild/cairo.zig), in place
  # of conda-forge's cairo, pango and harfbuzz; the recipe renders for
  # win-arm64 (feat-win-arm64). The same number, not yet published (one
  # release for the whole backlog, the user's decision of 2026-11-12):
  # R 4.6.2; flang-pixi's LLVM 23.1.5 (flang-zig 0, flang-rt-zig 1) and
  # its libomp, llvm-openmp's zig_* build, on every platform in place of
  # conda-forge's (whose win-arm64 libomp.dll breaks parallel regions
  # with more than six shared variables); linux's libR and base packages
  # hide their internal symbols as macOS's and CRAN's do (1257 exported
  # symbols, 2541 before); R_compiled_by() names this build's compilers;
  # R CMD config is rzig's, with no make and no sh, so it answers without
  # the build tools (feat-config-rzig); the extras group (cmake) and R's
  # recommended packages are packages of their own; win-arm64 is built,
  # tested and published as the other five (chore-release-11). Windows'
  # r-zig-slim is the slim variant, as on unix (no Tcl/Tk, JPEG, TIFF or
  # NLS), and its R.dll uses OpenMP and links libomp, as unix's libR does
  # (chore-release-11 finding 23, 2026-11-14). The host libraries take
  # conda-forge's global pins (recipe/variants.yaml): pcre2 10.47 in
  # place of 10.49, libdeflate 1.26 in place of the `<1.26` cap; glib
  # 2.90.0 on macOS (chore-release-11 finding 25, 2026-11-15).
  number: 11

outputs:
  # One build (scripts/zig-build.sh, then scripts/zig-toolchain.sh), six
  # packages (feat-standalone-toolchain B28 a; r-zig-extras and
  # r-zig-recommended since build 11). The base, r-zig-slim, owns
  # R and its compiler front rzig (R_HOME/bin/toolchain's compiler names,
  # which Makeconf points at, and share/zig/rpkg), as the standalone base
  # archive does (B19). Each group package owns, or depends on,
  # third-party software only: r-zig-compilers depends on zig, flang and
  # llvm-openmp; r-zig-build-tools on make (Windows: the MSYS2 tools), and
  # on Windows owns R_HOME/bin/toolchain/usr/ (pkgconf, built from source).
  # Windows' binutils are rzig's own names, r-zig-slim's
  # (feat-win-zig-binutils). r-zig-toolchain is the
  # metapackage of the groups (with r-zig-extras, cmake). Without a
  # group, an install that needs it stops with rzig's text naming that
  # package (the preflight, patch 0009); a missing cmake is only a note.
  - staging:
      name: r-zig-build
    requirements:
      build:
        - zig 0.17.*
        # Fortran, as pixi.toml: flang-pixi's zig-built flang-zig (LLVM
        # 23.1.5, `universe` channel — the conda-package task passes it) on
        # every platform; its runtime (flang-rt-zig) is static-only. No
        # gfortran anywhere (consolidation/PLAN.md Phase 2; linux-64 left
        # conda-forge's flang 2026-10-03). build.zig stops without
        # $BUILD_PREFIX/bin/flang (or $CONDA/bin/flang).
        # Pinned as in pixi.toml to flang-pixi's LLVM 23.1.5 release
        # (flang-zig 0, flang-rt-zig 1; flang-zig pins its lld-zig). The build string's `_N` suffix
        # pins it: a `[build_number="==N"]` bracket would be copied into
        # r-zig-compilers' depends (r-zig-toolchain only pins the other
        # three outputs, B28), which conda's default (libmamba) solver and
        # micromamba cannot parse.
        - flang-zig ==23.1.5 *_0
        - flang-rt-zig ==23.1.5 *_1
        - make >=4.4
        - pkg-config
        - if: linux
          then:
            - patchelf
        - if: unix
          then:
            - bash
            - coreutils
            - sed
            - grep
            - gawk
            # unzip: build.zig shells out to it directly for share/zoneinfo
            # (zoneinfo.zip); gzip: grDevices' afm compression; tar/zip: not
            # invoked by the R build itself but kept for parity with pixi.
            # toml's own [target.unix.dependencies] set this recipe otherwise
            # mirrors — real gap found via a real `pixi run -e pkg
            # conda-package` run ("failed to spawn ... unzip: FileNotFound"),
            # since the old autoconf path apparently never needed them in the
            # rattler-build sandbox specifically (or was never exercised there).
            - unzip
            - gzip
            - tar
            - zip
            # zig-build.sh applies R's source patches (zigbuild/patches/)
            - patch
        # gnuwin32 has no `configure`/autoconf step, so none of the unix
        # GNU-text-tool deps above apply — instead it needs the msys
        # userland to run at all (native make can't spawn the extensionless
        # zig shim scripts) plus uutils for the coreutils build.sh itself
        # uses. m2-bash is also what runs *this* build.sh in the first place
        # (rattler-build has no bld.bat here, same as conda-build convention).
        # uutils-coreutils on win-64 only: its win-arm64 builds refuse
        # m2-coreutils (pixi.toml's [target.win-64.dependencies])
        - if: build_platform == "win-64"
          then:
            - uutils-coreutils
        - if: win
          then:
            - m2-bash
            - m2-make
            - m2-coreutils
            - m2-diffutils
            - m2-findutils
            - m2-texinfo
            - m2-which
            - m2-tar
            - m2-gzip
            - m2-sed
            - m2-grep
            - m2-gawk
            - m2-unzip
            - m2-zip
            - m2-patch  # zigbuild/patches/; conda-forge has no Windows `patch`
      host:
        # Fortran runtime: linked into libR (statically for flang's
        # libflang_rt.runtime.a on every platform, see build.zig's
        # linkFortranRt), must be in host too; pinned as in build
        - flang-rt-zig ==23.1.5 *_1
        - zlib
        - bzip2
        - xz
        - liblzma-devel
        # The libraries below without a version take conda-forge's global
        # pin from recipe/variants.yaml (pcre2 10.47.*, icu 78.*,
        # libdeflate 1.26.*, ...), as a conda-forge feedstock's do: their
        # run exports then match the conda-forge packages r-zig-slim
        # shares an env with. A version here would switch that off.
        # icu, for one, was `icu 78.*` here (2026-11-05): conda-forge's
        # zig needs libxml2-16, built against icu 78 only, and `<79` alone
        # let the solver take the 2022 cairo/pango stack of icu 70.
        - pcre2
        - libcurl
        - icu
        - tzdata
        - libdeflate
        # flang-pixi's libomp, as pixi.toml: the zig_* build of the same
        # LLVM release as flang, on every platform (conda-forge's
        # win-arm64 libomp.dll breaks parallel regions with more than six
        # shared variables).
        - llvm-openmp ==23.1.5 zig_*_1
        # cairo and pango on unix only: Windows builds its cairo
        # (zigbuild/cairo.zig) against the env's pixman, libpng and zlib,
        # and R's Windows device has no pango
        - if: unix
          then:
            - cairo
            - pango
        - if: win
          then:
            - pixman
        - expat
        - fontconfig
        - freetype
        - libpng
        # glib on unix only, as pixi.toml: R's Windows build uses none of
        # it, and on Windows glib's python brings tk.
        - if: unix
          then:
            - glib
        # pango/cairo only pull in libharfbuzz (the runtime .so) as their own
        # transitive run dependency, not the headers — the vendored
        # CAIRO_CPPFLAGS build.zig applies unconditionally references
        # <include>/harfbuzz/hb.h directly (pango-coverage.h's own #include),
        # a real gap only surfaced once zig-build.sh started compiling the
        # cairo module unconditionally in the rattler-build sandbox (found via
        # a real "'hb.h' file not found" error, verified with a real `pixi run
        # -e pkg conda-package` run) — the equivalent pixi.toml dev env never
        # hit this because something else in its much larger dependency graph
        # happens to pull the headers package in transitively too. Build-time
        # only: end users don't need hb.h, and libharfbuzz.so is already
        # pulled in at runtime via pango's own run dependency. unix only,
        # as pango.
        - if: unix
          then:
            - harfbuzz
        # conda-forge's linux cairo needs xorg proto headers even though R
        # builds --with-x=no (pkg-config chain, not an actual X11 dep)
        - if: linux
          then:
            - xorg-xorgproto
        # discovered via `ldd`/`otool -L` on the actual built bin/exec/R +
        # libR — the full runtime closure, not just pixi.toml's direct deps.
        # zstd on every OS (feat-standalone-toolchain E2, widened from
        # win-64 by phase 4's survey): libR.so, libR.dylib and R.dll link
        # it (HAVE_ZSTD in every config)
        - zstd
        - if: linux
          then:
            - libiconv
            - libstdcxx
            - libgcc
        - if: osx
          then:
            - libiconv
        # No libjpeg-turbo, libtiff, tk or gettext, on Windows too
        # (2026-11-14): r-zig-slim is the slim variant on every OS
        # (build.zig's variant table, zigbuild/config/win-slim). R's
        # Windows NLS is its own intl, and only full has it.
    build:
      # A staging output is not a package: rattler-build sets no PKG_NAME
      # or PKG_VERSION for it, so pass what build.sh and zig-build.sh read.
      script:
        file: build.sh
        env:
          R_VERSION: ${{ version }}

  - package:
      name: r-zig-slim
    inherit: r-zig-build
    build:
      # everything but the groups' directories under R_HOME/bin/toolchain
      # (feat-standalone-toolchain B20, B28): rzig's names and its link
      # object stay here (Windows: with the binutils, rzig's names too). Of
      # these, the conda build makes only Windows' usr/ (pkgconf), which
      # r-zig-build-tools owns; etc/ is the standalone tree's only on
      # Windows (PHASE7 Cr5); binutils/ is gone (feat-win-zig-binutils) and
      # stays excluded so no old tree's copy can ride along; cmake/ is the
      # extras' (feat-extras-group), which the conda build never makes. R's
      # recommended packages are r-zig-recommended's.
      files:
        exclude:
          - lib/R/bin/toolchain/{zig,flang,openmp,usr,etc,binutils,cmake}/**
          - Library/lib/R/bin/toolchain/{zig,flang,openmp,usr,etc,binutils,cmake}/**
          - lib/R/library/${{ recommended }}/**
          - Library/lib/R/library/${{ recommended }}/**
    requirements:
      run:
        # R's own shared libraries (libR, base packages like stats/utils via
        # pcre2/icu, cairo devices, ...) are runtime-loaded — every *runtime*
        # lib from host: must be repeated here, or R fails to initialize in a
        # freshly solved env (host: alone is build-time only). xorg-xorgproto
        # and liblzma-devel are headers-only (pkg-config/build inputs),
        # intentionally omitted here.
        - zlib
        - bzip2
        - xz
        - pcre2
        - libcurl
        - icu
        - tzdata
        - libdeflate
        # The zig_* build (flang-pixi's, `universe`) on every platform:
        # the libomp R was built and tested with, and on win-arm64 the
        # only one that runs R's packages. A floor and no ceiling: a newer
        # libomp runs code built against an older omp.h.
        - llvm-openmp >=23.1.5 zig_*
        # Windows: pixman, which winCairo.dll's cairo (r-zig's build) needs
        - if: unix
          then:
            - cairo
            - pango
        - if: win
          then:
            - pixman
        - expat
        - fontconfig
        - freetype
        - libpng
        # unix only, as the staging host
        - if: unix
          then:
            - glib
        # E2, on every OS (staging host): R.dll links it in every variant
        - zstd
        - if: linux
          then:
            - libiconv
            - libstdcxx
            - libgcc
        - if: osx
          then:
            - libiconv
            # build.zig's deployment target (macos_min): every Mach-O says
            # minos 13.0, so refuse older macOS at solve time rather than
            # at load time. The group packages get it through their exact
            # pins.
            - __osx >=13.0
      run_constraints:
        # the zig that built R and rzig: rzig finds the env's zig first
        # (B34), and B32's check stops a compile with another
        # major.minor; conda-forge's main label has 0.17.0 since
        # 2026-10-13 and 0.17.1 since 2026-11-12 (the dev lock's since
        # 2026-11-15). Constrains an installed zig, pulls none in; moved
        # with r-zig-compilers' pins in the zig 0.17 wave (B18; PHASE4
        # open point K a; feat-zig-017)
        - zig 0.17.*
        # conda-forge's r-* packages depend on r-base; without this, adding
        # one to an env with r-zig-slim silently installs conda-forge's R
        # over r-zig's; with it the solve fails and names the conflict
        # (chore-release-11 finding 31). The other outputs that hold R's
        # files (r-zig-recommended) or run it pin r-zig-slim exactly, so
        # they get it through that pin.
        - r-base <0a0
    tests:
      # Mirrors scripts/smoke-test.sh's actual assertions (numerics: LAPACK
      # solve/qr, BLAS matmul, fft round-trip; pcre2 regex; zlib compression;
      # the slim capability profile) rather than a stripped-down subset — a
      # conda package is a distribution artifact, and this is the one check
      # that runs in a truly isolated env (no dev pixi env masking a gap).
      # Windows asserts the same slim profile (2026-11-14), and test-win.R
      # also checks it by what R does: png draws, jpeg() and tiff() fail
      # cleanly, library(tcltk) gives the stub's message.
      - script:
          content:
            - if: win
              then:
                # Neither %PREFIX% (verified via an `echo %PATH%` probe) nor
                # $PREFIX (verified for real: a real CI run got this far and
                # cmd.exe choked trying to literally run a program named
                # "$PREFIX/Library/...", exit 9009 — bash syntax means
                # nothing to cmd.exe) reliably expand in rattler-build's
                # Windows test sandbox. Bare `Rscript` was never actually
                # testing what its own comment used to claim either (PATH-
                # based invocation of the Library/bin/{R,Rscript}.bat shims
                # is covered by the separate fresh-env consume test instead —
                # scripts/conda-consume.sh, which build.yaml runs — where PATH is
                # genuinely expanded, against a real installed env). So: a
                # relative path back to the test env root instead of any
                # PREFIX substitution at all. The test's own cwd is always
                # <test_run_env>/etc/conda/test-files/r-zig-slim/0 (fixed —
                # PKG_NAME is a constant "r-zig-slim", "0" is the single
                # test-script index rattler-build assigns), 5 levels below
                # <test_run_env>, so 5 `..` reaches Library/lib/R directly,
                # dialect-agnostic since it's plain relative path syntax.
                #
                # A real .R file, not inline `-e '...'`: cmd.exe has NO
                # concept of single quotes as a quoting mechanism — they're
                # just literal characters — so every cmd.exe metacharacter
                # inside the "quoted" R code (`%*%`'s `%`, `<-`'s `<`) was
                # being actively interpreted (`%...%` as variable expansion,
                # `<` as input redirection) rather than protected. Found by
                # inspecting the actual generated test/conda_build.bat
                # directly (its own content was correct — `Rscript -e
                # 'm <- matrix(...); ... %*% ...'`, verbatim from this
                # recipe) and reproducing the corruption independently at
                # cmd.exe's OWN runtime parsing stage, not YAML rendering.
                # bin/x64: the same hardcoded R_ARCH="x64" convention
                # build.zig's buildWindows() has throughout (bin/x64,
                # libs/x64, modules/x64, etc/x64), on win-arm64 too: R's
                # Windows build keeps R_ARCH /x64 on aarch64 (MkRules.rules:
                # WIN = 64; build.zig's config_dir comment).
                - 'echo PATHDEBUG=%PATH%'
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-win.R'
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-preflight.R'
              else:
                - $PREFIX/bin/Rscript -e 'set.seed(1); m <- matrix(rnorm(64),8,8); stopifnot(max(abs(solve(m) %*% m - diag(8))) < 1e-9); stopifnot(abs(det(qr.R(qr(m)))) > 0); stopifnot(max(Mod(fft(fft(1:8), inverse = TRUE) / 8 - 1:8)) < 1e-9); stopifnot(grepl("[0-9]+", "R 4", perl = TRUE), identical(memDecompress(memCompress("x")), charToRaw("x"))); caps <- capabilities(); stopifnot(caps[["cairo"]], caps[["png"]], caps[["ICU"]], caps[["iconv"]], caps[["libcurl"]], !caps[["X11"]], !caps[["aqua"]], !caps[["tcltk"]], !caps[["jpeg"]], !caps[["tiff"]], !caps[["NLS"]]); cat("conda R OK\n")'
                - $PREFIX/bin/Rscript test-preflight.R
          # conda-package's shared zig cache for the recipe tests
          # (pixi.toml): on unix rattler-build gives a test script a clean
          # environment, PATH and its own variables only, so the caller's
          # R_ZIG_TEST_ZIG_CACHE reaches the test only as a secret, which
          # records its name in info/tests but not its value (`env:` would
          # record the build machine's path). Unset, rattler-build warns and
          # each test uses its own cache.
          secrets:
            - R_ZIG_TEST_ZIG_CACHE
        files:
          recipe:
            - test-win.R
            - test-preflight.R
      # rzig, its link object (linux, Windows; feat-r-home-link-objects)
      # and rpkg are the base's on every channel (B19); no group's
      # directory is (B28). Not `strict`: whether the packaged test files
      # count in the checked list is unverified (PHASE4 Cc12), and
      # `not_exists` holds either way
      - package_contents:
          files:
            exists:
              - if: win
                then:
                  - Library/lib/R/bin/toolchain/rzig.exe
                  - Library/lib/R/bin/toolchain/gcc.exe
                  # the binutils, rzig's names (feat-win-zig-binutils)
                  - Library/lib/R/bin/toolchain/nm.exe
                  - Library/lib/R/bin/toolchain/objdump.exe
                  - Library/lib/R/bin/toolchain/strip.exe
                  - Library/lib/R/bin/toolchain/dlltool.exe
                  - Library/lib/R/bin/toolchain/windres.exe
                  - Library/lib/R/bin/toolchain/as.exe
                  - Library/lib/R/share/zig/rpkg/build_t2.zig
                  # cairo, r-zig's build, linked into winCairo.dll
                  - Library/lib/R/library/grDevices/libs/x64/winCairo.dll
                  - Library/lib/R/share/licenses/cairo/COPYING
                  - Library/lib/R/share/licenses/cairo/COPYING-LGPL-2.1
                  - Library/lib/R/share/licenses/cairo/COPYING-MPL-1.1
                  - Library/lib/R/share/licenses/cairo/SOURCE
                else:
                  - lib/R/bin/toolchain/rzig
                  - lib/R/bin/toolchain/zig-cc
                  - lib/R/share/zig/rpkg/build_t2.zig
              - if: linux
                then:
                  - lib/R/bin/toolchain/dso_fini.o
              # x86_64 code (cfguard.zig); win-arm64's is the cache
              # flush (clear_cache.zig)
              - if: target_platform == "win-64"
                then:
                  - Library/lib/R/bin/toolchain/cfguard.o
              - if: target_platform == "win-arm64"
                then:
                  - Library/lib/R/bin/toolchain/clear_cache.o
            not_exists:
              - lib/R/bin/toolchain/{zig,flang,openmp,usr,etc,binutils,cmake}/**
              - Library/lib/R/bin/toolchain/{zig,flang,openmp,usr,etc,binutils,cmake}/**
              - lib/R/library/${{ recommended }}/**
              - Library/lib/R/library/${{ recommended }}/**
    about:
      summary: R built with the zig toolchain, with its compiler front rzig (headless slim profile)
      # Windows: R's and, linked into winCairo.dll, cairo's (r-zig's
      # build, zigbuild/cairo.zig; its texts in R_HOME/share/licenses/cairo)
      license: ${{ "(GPL-2.0-only OR GPL-3.0-only) AND (LGPL-2.1-only OR MPL-1.1)" if win else "GPL-2.0-only OR GPL-3.0-only" }}
      description: |
        R built from source with the zig toolchain, in the headless slim
        profile on every OS: cairo and PNG graphics, ICU, libcurl and
        OpenMP; no X11, Tcl/Tk, JPEG, TIFF or NLS.

        To compile packages, add r-zig-toolchain (r-zig-compilers,
        r-zig-build-tools and r-zig-extras). r-zig-compilers alone installs
        packages that have no configure script and no make rules.

  # The groups (feat-standalone-toolchain B28 a, B38). Each pins exactly
  # the R build whose Makeconf and rzig it serves, and comes without the
  # staging host's run exports (cairo, icu, libcurl, ...): R's libraries
  # come with r-zig-slim. `inherit` with `files: []` (or a conditional
  # list no branch of which matches) makes a package with no payload
  # (rattler-build >= 0.76, pixi.toml), the form rattler-build's own
  # tests cover with both --error-* flags; it holds only its test file,
  # under etc/conda/test-files/ (PHASE4 risk 4).
  - package:
      name: r-zig-compilers
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      files: []
    requirements:
      run:
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
        # The compilers rzig runs. The Fortran compiler must be the one R
        # itself was built with (CRAN's own rule — module files and
        # runtime ABI differ between Fortran compilers), so this mirrors
        # the build exactly. flang-zig's closure is ~1.5 GiB (flang-zig +
        # lld-zig + flang-rt-zig), the accepted cost of one Fortran
        # toolchain everywhere (on osx-arm64, of correct complex LAPACK at
        # -O2; flang-pixi docs/11). Pinned as in build, so a user gets the
        # zig 0.17 flang this was built and tested with, not a later
        # build. zig: the one that built R and rzig, B32's check fails on
        # another major.minor (r-zig-slim also constrains it, PHASE4 open
        # point K).
        - zig 0.17.*
        # zig links every Fortran program and library since phase 6, so
        # nothing of ours runs lld-zig; flang-zig depends on its own build
        # of it (PHASE6 open point Q), so it is not named here.
        - flang-zig ==23.1.5 *_0
        - flang-rt-zig ==23.1.5 *_1
        # omp.h and libomp: r-zig-slim already has them (B41's
        # exception); named here as B28 lists the group
        - llvm-openmp >=23.1.5 zig_*
    tests:
      - package_contents:
          files:
            not_exists:
              - lib/R/**
              - Library/lib/R/**
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-compilers.R'
              else:
                - $PREFIX/bin/Rscript test-compilers.R
          # the tests' shared zig cache, as r-zig-slim's test
          secrets:
            - R_ZIG_TEST_ZIG_CACHE
        files:
          recipe:
            - test-compilers.R
    about:
      summary: The r-zig compilers for r-zig-slim (zig 0.17, LLVM flang from flang-pixi, OpenMP)

  - package:
      name: r-zig-build-tools
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      # Windows: usr/bin's pkgconf.exe and pkg-config.exe, which the
      # toolchain build compiles from source (zigbuild/toolchain/pkgconf.zig), with
      # usr/SOURCES and usr/LICENSES/pkgconf/. R puts usr/bin first on
      # PATH, before the env's. unix: nothing (no branch matches: an empty
      # package)
      files:
        - if: win
          then:
            - Library/lib/R/bin/toolchain/usr/**
    requirements:
      run:
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
        # B28 (a): unix make. On Windows, m2-make is the make R runs (it
        # comes first on PATH), so no native make there (PHASE4 Cg7;
        # PHASE7 open point B a)
        - if: unix
          then:
            - make >=4.4
        # Windows: the build-tools group's set on both channels (B11; PHASE7
        # open points A-C): MSYS2's userland from conda-forge's m2 packages;
        # the standalone tree copies the same packages' files into
        # R_HOME/bin/toolchain/usr/bin. pkg-config is pkgconf, built by
        # the toolchain build on both channels (files, above). R puts this
        # env's Library/usr/bin on PATH itself, after the group's usr/bin,
        # in R and under R CMD (PHASE7 F2 b)
        - if: win
          then:
            # bash.exe: packages' own configure scripts and make's recipe
            # shell. (Until rzig, gcc.exe/g++.exe also ran the zig-cc shim
            # through it; m2-bash was build:-only until a real
            # `install.packages()` failure, glue/cli probing `cc --version`,
            # showed every compile failing in a freshly installed env.)
            - m2-bash
            # sed/grep/gawk/coreutils/make/which/find: real CRAN packages' own
            # `configure` scripts (autoconf-generated, arbitrary — not
            # something this project controls) lean on these heavily; m2-bash
            # alone only gets the shell *interpreter* present, not the tools
            # the script's own body calls. Found via a real, reproduced
            # `install.packages("pak")` failure on a freshly-installed
            # package: `./configure: line 62: sed: command not found` —
            # `sed.exe` genuinely didn't exist anywhere in the installed env
            # (these were build:-only, same gap m2-bash had). `make` also
            # needed here: `R CMD SHLIB`/`INSTALL` shells out to it to
            # drive compilation for any package that needs make (a
            # configure script, a Makevars rule), not just packages with a
            # configure script.
            # texinfo/diffutils/tar/gzip/unzip/zip stay build:-only —
            # documentation-generation and archive tools a package's own
            # `configure`/compile step essentially never needs; add if a real
            # failure ever proves otherwise, same discipline as everything
            # else in this list.
            - m2-sed
            - m2-grep
            - m2-gawk
            - m2-coreutils
            - m2-make
            - m2-which
            - m2-findutils
            # a configure script that patches its sources (hdf5r's unix
            # configure; feat-win-link-fixes item 4)
            - m2-patch
            # a configure script that unpacks its sources (duckdb 2.0.0:
            # `tar xf duckdb.tar`; chore-release-11 finding 34)
            - m2-tar
    tests:
      - package_contents:
          files:
            exists:
              - if: win
                then:
                  # one entry per tool: an `exists` glob passes when it
                  # matches one file, so a {a,b} list would not catch a
                  # missing tool
                  - Library/lib/R/bin/toolchain/usr/bin/pkgconf.exe
                  - Library/lib/R/bin/toolchain/usr/bin/pkg-config.exe
                  - Library/lib/R/bin/toolchain/usr/SOURCES
                  - Library/lib/R/bin/toolchain/usr/LICENSES/pkgconf/COPYING
                  - Library/lib/R/bin/toolchain/usr/LICENSES/pkgconf/mingw-w64-crt-COPYING
            not_exists:
              - lib/R/**
              - Library/lib/R/bin/toolchain/{gcc,rzig}.exe
              - Library/lib/R/bin/toolchain/binutils/**
              - Library/lib/R/etc/**
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-build-tools.R'
              else:
                - $PREFIX/bin/Rscript test-build-tools.R
          # the tests' shared zig cache, as r-zig-slim's test
          secrets:
            - R_ZIG_TEST_ZIG_CACHE
        files:
          recipe:
            - test-build-tools.R
    about:
      summary: The r-zig build tools for r-zig-slim (make; on Windows also sh, the MSYS2 tools and pkg-config)
      # Windows holds pkgconf (ISC), with the mingw-w64 CRT startup zig
      # links into it (ZPL-2.1); unix holds no file
      license: ${{ "ISC AND ZPL-2.1" if win else "GPL-2.0-only OR GPL-3.0-only" }}

  # The extras group (feat-extras-group): cmake, for packages that build
  # a bundled library with it (nloptr, s2, RcppParallel's TBB...).
  # conda-forge's cmake, not bundled, as r-zig-compilers depends on zig;
  # the standalone tree's cmake/ is Kitware's release archive. An empty
  # package.
  - package:
      name: r-zig-extras
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      files: []
    requirements:
      run:
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
        # <4.5: Boost <= 1.92's locale CMakeLists (chore-release-11 finding 33)
        - cmake <4.5
    tests:
      - package_contents:
          files:
            not_exists:
              - lib/R/**
              - Library/lib/R/**
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-extras.R'
              else:
                - $PREFIX/bin/Rscript test-extras.R
        files:
          recipe:
            - test-extras.R
    about:
      summary: The r-zig extras for r-zig-slim (cmake, from conda-forge)

  - package:
      name: r-zig-toolchain
    # the metapackage of the groups (B28 a): `pixi add r-zig-toolchain`
    # installs everything a package build needs, as it did up to build 8;
    # with r-zig-extras since feat-extras-group (cmake: a 26 MB download
    # beside the compilers' 1.9 GB)
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      files: []
    requirements:
      run:
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
        - ${{ pin_subpackage("r-zig-compilers", exact=True) }}
        - ${{ pin_subpackage("r-zig-build-tools", exact=True) }}
        - ${{ pin_subpackage("r-zig-extras", exact=True) }}
    tests:
      - package_contents:
          files:
            not_exists:
              - lib/R/**
              - Library/lib/R/**
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-toolchain.R'
              else:
                - $PREFIX/bin/Rscript test-toolchain.R
          # the tests' shared zig cache, as r-zig-slim's test
          secrets:
            - R_ZIG_TEST_ZIG_CACHE
        files:
          recipe:
            - test-toolchain.R
    about:
      summary: "The r-zig toolchain for r-zig-slim: r-zig-compilers, r-zig-build-tools and r-zig-extras"

  # R's 15 recommended packages (MASS, lattice, Matrix, ..., mgcv), from
  # the tarballs R's source carries, installed by build.sh's last step
  # (scripts/zig-recommended.sh, zigbuild/recommended/build.zig) with the
  # R and the compilers this build made (feat-recommended-packages
  # PLAN.md). Opt-in: no other package depends on it (the user,
  # 2026-11-12: "Recommended packages need to ship on their own conda
  # package"). Its binaries need libR, Rblas, Rlapack and (mgcv) libomp,
  # all r-zig-slim's (the Fortran runtime is static), so it pins the
  # exact r-zig-slim build and has no run export of the staging host.
  - package:
      name: r-zig-recommended
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      files:
        - lib/R/library/${{ recommended }}/**
        - Library/lib/R/library/${{ recommended }}/**
    requirements:
      run:
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
    tests:
      - package_contents:
          files:
            exists:
              - if: win
                then:
                  - Library/lib/R/library/Matrix/libs/x64/Matrix.dll
                  - Library/lib/R/library/mgcv/libs/x64/mgcv.dll
                else:
                  - lib/R/library/Matrix/libs/Matrix.so
                  - lib/R/library/mgcv/libs/mgcv.so
            not_exists:
              - lib/R/bin/**
              - Library/lib/R/bin/**
              - lib/R/library/{base,stats,utils,tools}/**
              - Library/lib/R/library/{base,stats,utils,tools}/**
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-recommended.R'
              else:
                - $PREFIX/bin/Rscript test-recommended.R
        files:
          recipe:
            - test-recommended.R
    about:
      summary: R's 15 recommended packages (MASS, lattice, Matrix, nlme, survival, mgcv, ...) for r-zig-slim
      # each package's DESCRIPTION: GPL (>= 2) cluster, foreign, lattice,
      # mgcv, nlme, Matrix; GPL-2 | GPL-3 class, MASS, nnet, rpart,
      # spatial; GPL codetools; LGPL (>= 2) survival; Unlimited boot,
      # KernSmooth; Matrix's bundled SuiteSparse (its LICENCE file):
      # BSD-3-Clause, LGPL-2.1-or-later, GPL-2.0-or-later, and METIS,
      # Apache-2.0. The texts are in each package's directory.
      license: GPL-2.0-or-later AND (GPL-2.0-only OR GPL-3.0-only) AND LGPL-2.0-or-later AND LGPL-2.1-or-later AND BSD-3-Clause AND Apache-2.0 AND LicenseRef-Unlimited

about:
  homepage: https://www.r-project.org
  # R's own (PHASE4 open point E a), as the r-zig wheel says; Windows'
  # r-zig-build-tools states its pkgconf's own
  license: GPL-2.0-only OR GPL-3.0-only
  summary: R built with the zig toolchain (headless slim profile)
