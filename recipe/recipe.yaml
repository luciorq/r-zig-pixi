context:
  version: "4.6.1"

recipe:
  name: r-zig
  version: ${{ version }}

source:
  # R sources from CRAN plus this repo's build scripts — the recipe is a
  # consumer of the same scripts pixi tasks use. The compilers in
  # R_HOME/bin/toolchain are rzig (zigbuild/tools/rzig/), built by zig
  # build; the bash shims in toolchain/ only serve configure-only.sh.
  - url: https://cran.r-project.org/src/base/R-4/R-${{ version }}.tar.gz
    sha256: 4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
    target_directory: R-src
  - path: ../scripts
    target_directory: scripts
  # build.zig/zigbuild/: scripts/zig-build.sh's own build system (recipe/
  # build.sh drives it since Milestone 5's default-path swap). Without
  # these explicitly listed, a local `rattler-build build` still
  # "succeeds" — `zig build` walks UP parent directories looking for
  # build.zig when it's missing from the sandbox's own work dir, and
  # rattler-build's local output-dir (dist/conda/bld/.../work/) happens
  # to sit inside this same checkout, so it silently finds the REAL
  # project's build.zig several levels up instead of the sandboxed copy
  # (found by inspecting the kept work dir directly via `rattler-build
  # build --keep-build` — it genuinely had no build.zig/zigbuild/ at all).
  # That accidental behavior wouldn't survive the recipe/build.sh
  # source being built anywhere other than nested inside this exact
  # checkout (e.g. a standalone feedstock-style recipe repo) — vendor
  # them explicitly instead of relying on it.
  - path: ../build.zig
    target_directory: .
  - path: ../zigbuild
    target_directory: zigbuild

build:
  # 2: first zig-built release (recipe/build.sh switched from configure-
  # r.sh/build-r.sh/install-r.sh to zig-build.sh + stage.sh, Milestone 5's
  # default-path swap; also past 1, a Windows-only build already
  # released). 3: Windows-only follow-up — Rcmd.exe/config.sh/
  # Rcmd_environ fixes (F7.1, see feat-zig-build/TODO.md) for a real user-
  # reported install.packages() failure. 4: Windows-only follow-up — the
  # gcc.exe/g++.exe forwarder's baked-in bash.exe/zig-cc paths pointed into
  # the (torn-down) build sandbox, and m2-bash wasn't a run: dependency at
  # all, so package compilation was silently broken on every real install
  # (see build.zig's win-exec-forward.c rewrite). 5: all 3 platforms —
  # default user package library (R_LIBS_USER) now differentiated from any
  # other R install: XDG base dir spec on Linux/macOS
  # (~/.local/share/R/<platform>-zig/<x.y>, respects $XDG_DATA_HOME),
  # LOCALAPPDATA/R/win-64-zig/<x.y> on Windows (unchanged, already the
  # right semantic equivalent) — requested directly, not a bug (F7.3, see
  # feat-zig-build/TODO.md). 6: Windows-only follow-up — m2-sed/m2-grep/
  # m2-gawk/m2-coreutils/m2-make/m2-which/m2-findutils added to run: (only
  # m2-bash was there before); real packages' own configure scripts need
  # them, found via a real `install.packages("pak")` failure (F7.1
  # follow-up, see feat-zig-build/TODO.md). 7: Windows-only follow-up —
  # the real root cause behind F7.1's recursive-configure access
  # violation (0xC0000005 in R.dll, deterministic, 5/5 reproductions):
  # a ReleaseFast-specific Zig/MinGW codegen issue on the windows-gnu
  # target (likely TLS-access lowering) — .Debug and .ReleaseSafe both
  # avoid it entirely, .ReleaseFast crashes every time on identical
  # source. build.zig's newCMod now builds Windows with .ReleaseSafe
  # instead of .ReleaseFast (Linux/macOS unchanged — never observed
  # there); see F7.6 in feat-zig-build/TODO.md for the full root-cause
  # writeup and verification (smoke + contract both pass, no
  # regression). 8: win-64 + osx-arm64 (linux-64 untouched, stays at 5) —
  # F7.7: win-exec-forward.c's _spawnv-based command-line construction
  # silently stripped embedded double-quote characters from -D flag
  # values (any package quoting a string literal that way, not just one
  # package); F7.8: OBJC was never routed through the zig-cc toolchain
  # shim on macOS (only OBJCXX was, by an autoconf fallback accident),
  # so any package with real Objective-C source silently compiled as
  # plain C. Both found and fixed while adding `pak` (a package that
  # exercises both) to contract-test.sh; see F7.7/F7.8 in
  # feat-zig-build/TODO.md. 9: no functional change — bumped solely to
  # force a fresh publish while testing the self-hosted CI pipeline
  # itself (see feat-prefix-publish/CI_SELF_HOSTED_PLAN.md).
  #
  # Version-bump policy (decided 2026-08-06, see feat-prefix-publish/
  # TODO.md's "End goal" section): stays fully manual — bump this number
  # as a deliberate part of any PR that should trigger a republish, same
  # as every prior bump above. `--skip-existing` on the publish task is
  # the safety net for CI runs that don't include one (same version+
  # build already on the channel is silently skipped, not an error).
  #
  # Reset 9 → 1 (2026-08-07, see feat-prefix-publish/CHANNEL_CLEANUP.md):
  # the `universe` channel is going public, and the messy build-number
  # history above (builds 0/1 from the retired autoconf/gnuwin32
  # pipeline, per-platform numbers that never lined up — win-64 topped
  # out at 8 while linux-64/osx-arm64 reached 9) isn't something a new
  # public consumer should have to understand just to `pixi add
  # r-zig-slim`. All 18 previously-published packages across all 3
  # platforms were deleted first (CHANNEL_CLEANUP.md's own inventory),
  # via prefix.dev's REST delete API — the dashboard deliberately has no
  # delete button; use scripts/prefix-delete-package.sh / the
  # conda-channel-delete pixi task if deletion is ever needed again.
  # This reset doesn't collide with anything already on the channel, and
  # is a one-time reset tied to going public, not a new precedent — the
  # manual-bump policy above is unaffected and still governs every
  # future change.
  # 1 → 2 (2026-09-20): Phase 2 shipped LLVM flang for every platform's
  # Fortran (flang-zig on osx-arm64/osx-64/win-64/linux-aarch64), but the
  # build string did not change and `--skip-existing` silently kept the
  # gfortran-built files on the channel through three "successful"
  # publish runs — the channel's osx-arm64/win-64 files were still the
  # 2026-08-15 uploads. A Fortran-runtime swap in run: deps is exactly
  # the kind of change this policy says must bump.
  # 2 → 3 (2026-09-25): the zig-cc/zig-cxx shims shipped in R_HOME/bin/
  # toolchain changed — macOS drops repeated -l<name> (quadprog's
  # "duplicate linked dylib" on flang's runtime), and every shim now falls
  # back to `python3 -m ziglang` — plus package-standalone.sh's whole-token
  # Makeconf stripping. Package-compilation behavior on the channel only
  # changes if these files are republished.
  # 3 → 4 (2026-09-30): split into r-zig-slim (R) and r-zig-toolchain
  # (lib/R/bin/toolchain plus the compiler run dependencies), phase T of
  # feat-no-host-paths; libc++ static everywhere; FLIBS names the static
  # flang runtime. linux-64's Fortran moved from conda-forge's flang to
  # flang-zig (2026-10-03) before build 4 was published, so it rides here.
  # 4 → 5 (2026-10-06): rzig, the compilers r-zig-toolchain ships in
  # R_HOME/bin/toolchain, passes -mcpu=baseline on every OS. Build 4 (on
  # universe for all five subdirs) compiles Windows packages for the
  # compiling machine's own CPU (zig cc has no -target there, so a native
  # CPU: target-cpu "skylake" on kappa), which another machine's CPU may
  # lack; linux and macOS were already baseline through their -target.
  # (fix-rzig-baseline-cpu PLAN.md)
  # 5 → 6 (2026-10-08): rzig links flang's runtime for a package's
  # -lgfortran/-lquadmath on every OS (Windows asked a gfortran on PATH;
  # elsewhere the link failed or the package did not load), and on
  # Windows makes -lsynchronization (Rust-based packages) link with
  # upstream zig; win-64's Makeconf says TCL_VERSION = 86t, the names of
  # conda-forge's Tcl/Tk (tcl86t, tk86t), so packages that link Tcl/Tk
  # through TCLTK_LIBS (tkrplot) link (fix-rzig-follow-ups PLAN.md).
  # 6 → 7 (2026-10-08): the stress suite's round 1 (feat-stress-suite
  # stress/results/2026-10-08.md; fix-stress-round1 PLAN.md). rzig works
  # around zig 0.16's behaviours that broke CRAN packages (S1-S11). The
  # Windows tree takes CRAN's layout (S13-S15): Makeconf's R_ARCH = /x64
  # and COMPILED_BY, R_HOME/bin/R.exe and Rscript.exe, CC and CXX named
  # with .exe, and etc/Rcmd_environ sets CMake's generator and windres.
  # libdeflate <1.26 in host, so r-zig-slim shares a conda env with
  # conda-forge's GDAL (S19).
  # 7 → 8 (2026-10-10): no build-machine leftovers (fix-no-build-leftovers
  # PLAN.md). R's own linux binaries carry no debug info, in every
  # variant, as macOS's already did (libR.so 11.8 → 3.5 MB). The base
  # packages' help databases, help/paths.rds, doc/NEWS*.rds and code
  # databases name no build path: build 7's named rattler's work dir and
  # host prefix inside their compressed objects, which conda's prefix
  # replacement cannot reach.
  number: 8

outputs:
  # One build (scripts/zig-build.sh), two packages split by
  # directory: the toolchain package owns R_HOME/bin/toolchain, which
  # Makeconf points at, and the compiler run dependencies; everything else
  # is R. Without the toolchain, installing a package that has compiled
  # code stops with the preflight message (zigbuild/patches/) naming it.
  - staging:
      name: r-zig-build
    requirements:
      build:
        - zig 0.16.*
        # Fortran, as pixi.toml: flang-pixi's zig-built flang-zig (LLVM
        # 23.1.1, `universe` channel — the conda-package task passes it) on
        # every platform; its runtime (flang-rt-zig) is static-only. No
        # gfortran anywhere (consolidation/PLAN.md Phase 2; linux-64 left
        # conda-forge's flang 2026-10-03). build.zig stops without
        # $BUILD_PREFIX/bin/flang (or $CONDA/bin/flang).
        # Pinned as in pixi.toml to flang-pixi's zig 0.16.0 release
        # (flang-zig 6, lld-zig 5, flang-rt-zig 10); its zig 0.17 builds
        # come at the next build numbers. The build string's `_N` suffix
        # pins it: a `[build_number="==N"]` bracket would be copied into
        # r-zig-toolchain's depends, which conda's default (libmamba)
        # solver and micromamba cannot parse. lld-zig only for its pin.
        - flang-zig ==23.1.1 *_6
        - lld-zig ==23.1.1 *_5
        - flang-rt-zig ==23.1.1 *_10
        - if: win
          then:
            - binutils_impl_win-64  # x86_64-w64-mingw32-nm/-dlltool for build.zig's import-stub steps
        - make >=4.4
        - pkg-config
        - if: linux
          then:
            - patchelf
        - if: unix
          then:
            - bash
            - coreutils
            - sed
            - grep
            - gawk
            # unzip: build.zig shells out to it directly for share/zoneinfo
            # (zoneinfo.zip); gzip: grDevices' afm compression; tar/zip: not
            # invoked by the R build itself but kept for parity with pixi.
            # toml's own [target.unix.dependencies] set this recipe otherwise
            # mirrors — real gap found via a real `pixi run -e pkg
            # conda-package` run ("failed to spawn ... unzip: FileNotFound"),
            # since the old autoconf path apparently never needed them in the
            # rattler-build sandbox specifically (or was never exercised there).
            - unzip
            - gzip
            - tar
            - zip
            # zig-build.sh applies R's source patches (zigbuild/patches/)
            - patch
        # gnuwin32 has no `configure`/autoconf step, so none of the unix
        # GNU-text-tool deps above apply — instead it needs the msys
        # userland to run at all (native make can't spawn the extensionless
        # zig shim scripts) plus uutils for the coreutils build.sh itself
        # uses. m2-bash is also what runs *this* build.sh in the first place
        # (rattler-build has no bld.bat here, same as conda-build convention).
        - if: win
          then:
            - uutils-coreutils
            - m2-bash
            - m2-make
            - m2-coreutils
            - m2-diffutils
            - m2-findutils
            - m2-texinfo
            - m2-which
            - m2-tar
            - m2-gzip
            - m2-sed
            - m2-grep
            - m2-gawk
            - m2-unzip
            - m2-zip
            - m2-patch  # zigbuild/patches/; conda-forge has no win-64 `patch`
      host:
        # Fortran runtime: linked into libR (statically for flang's
        # libflang_rt.runtime.a on every platform, see build.zig's
        # linkFortranRt), must be in host too; pinned as in build
        - flang-rt-zig ==23.1.1 *_10
        # build.zig copies the binutils tools (windres/ld/nm/dlltool/...) from
        # $PREFIX/Library/bin into lib/R/bin/toolchain for the package-
        # compilation contract, so they must be in *host* too (gfortran used
        # to drag them in here; conda-package win-64 failed with "unable to
        # update file from ...x86_64-w64-mingw32-windres.exe: FileNotFound"
        # the moment it left).
        - if: win
          then:
            - binutils_impl_win-64
        - zlib
        - bzip2
        - xz
        - liblzma-devel
        - pcre2
        - libcurl
        - icu
        - tzdata
        # <1.26 while conda-forge's libgdal-core needs <1.26: libdeflate's
        # run export pins r-zig-slim to the host's minor version, and builds
        # 2 to 6, built against 1.26 on linux and macOS (win-64's took
        # 1.25), could not share a conda env with sf, terra or gdalraster
        # (stress round 1, U4). Lift it, with a build-number bump, when
        # conda-forge's libgdal-core is built against 1.26 (its libdeflate
        # migration).
        - libdeflate <1.26
        # 23, as pixi.toml, so the conda build uses the libomp CI tests.
        # Its run export (>= the host version, 23.1.2 today) is the only
        # bound r-zig-slim's run gets (below).
        - llvm-openmp 23.*
        - cairo
        - expat
        - pango
        - fontconfig
        - freetype
        - libpng
        - glib
        # pango/cairo only pull in libharfbuzz (the runtime .so) as their own
        # transitive run dependency, not the headers — the vendored
        # CAIRO_CPPFLAGS build.zig applies unconditionally references
        # <include>/harfbuzz/hb.h directly (pango-coverage.h's own #include),
        # a real gap only surfaced once zig-build.sh started compiling the
        # cairo module unconditionally in the rattler-build sandbox (found via
        # a real "'hb.h' file not found" error, verified with a real `pixi run
        # -e pkg conda-package` run) — the equivalent pixi.toml dev env never
        # hit this because something else in its much larger dependency graph
        # happens to pull the headers package in transitively too. Build-time
        # only: end users don't need hb.h, and libharfbuzz.so is already
        # pulled in at runtime via pango's own run dependency.
        - harfbuzz
        # conda-forge's linux cairo needs xorg proto headers even though R
        # builds --with-x=no (pkg-config chain, not an actual X11 dep)
        - if: linux
          then:
            - xorg-xorgproto
        # discovered via `ldd`/`otool -L` on the actual built bin/exec/R +
        # libR — the full runtime closure, not just pixi.toml's direct deps
        - if: linux
          then:
            - zstd
            - libiconv
            - libstdcxx
            - libgcc
        - if: osx
          then:
            - libiconv
        # gnuwin32 has no capability off-switches (unlike unix's
        # --without-jpeglib etc.), so Windows R unconditionally links the
        # jpeg/tiff bitmap devices, the tcltk package, and NLS — these are
        # genuinely linked-at-runtime deps here, not just build inputs.
        # tk 8.6, as pixi.toml: tcltk.dll links tcl86t/tk86t; an unpinned
        # solve picks tk 9.0 (tcl90.dll), and the link fails.
        - if: win
          then:
            - libjpeg-turbo
            - libtiff
            - tk 8.6.*
            - gettext
    build:
      # A staging output is not a package: rattler-build sets no PKG_NAME
      # or PKG_VERSION for it, so pass what build.sh and zig-build.sh read.
      script:
        file: build.sh
        env:
          R_VERSION: ${{ version }}
          R_ZIG_CONDA_BUILD: "1"

  - package:
      name: r-zig-slim
    inherit: r-zig-build
    build:
      files:
        exclude:
          - lib/R/bin/toolchain/**
          - Library/lib/R/bin/toolchain/**
    requirements:
      run:
        # R's own shared libraries (libR, base packages like stats/utils via
        # pcre2/icu, cairo devices, ...) are runtime-loaded — every *runtime*
        # lib from host: must be repeated here, or R fails to initialize in a
        # freshly solved env (host: alone is build-time only). xorg-xorgproto
        # and liblzma-devel are headers-only (pkg-config/build inputs),
        # intentionally omitted here.
        - zlib
        - bzip2
        - xz
        - pcre2
        - libcurl
        - icu
        - tzdata
        - libdeflate
        # unpinned: host's run export sets the floor, and a newer libomp
        # runs code built against an older omp.h, so a ceiling would only
        # clash with packages built against the next LLVM's llvm-openmp
        - llvm-openmp
        - cairo
        - expat
        - pango
        - fontconfig
        - freetype
        - libpng
        - glib
        - if: linux
          then:
            - zstd
            - libiconv
            - libstdcxx
            - libgcc
        - if: osx
          then:
            - libiconv
            # build.zig's deployment target (macos_min): every Mach-O says
            # minos 13.0, so refuse older macOS at solve time rather than
            # at load time. r-zig-toolchain gets it through its exact pin.
            - __osx >=13.0
        - if: win
          then:
            - libjpeg-turbo
            - libtiff
            - tk 8.6.*
            - gettext
    tests:
      # Mirrors scripts/smoke-test.sh's actual assertions (numerics: LAPACK
      # solve/qr, BLAS matmul, fft round-trip; pcre2 regex; zlib compression;
      # the slim capability profile) rather than a stripped-down subset — a
      # conda package is a distribution artifact, and this is the one check
      # that runs in a truly isolated env (no dev pixi env masking a gap).
      # Windows keeps smoke-test.sh's own relaxed set: gnuwin32 has no slim/
      # full off-switches, so tcltk/jpeg/tiff/NLS are TRUE despite this being
      # r-zig-slim — asserting them FALSE here would be a false expectation,
      # not a real regression check.
      - script:
          content:
            - if: win
              then:
                # Neither %PREFIX% (verified via an `echo %PATH%` probe) nor
                # $PREFIX (verified for real: a real CI run got this far and
                # cmd.exe choked trying to literally run a program named
                # "$PREFIX/Library/...", exit 9009 — bash syntax means
                # nothing to cmd.exe) reliably expand in rattler-build's
                # Windows test sandbox. Bare `Rscript` was never actually
                # testing what its own comment used to claim either (PATH-
                # based invocation of the Library/bin/{R,Rscript}.bat shims
                # is covered by the separate fresh-env consume test instead —
                # build.yml / feat-prefix-publish devdocs — where PATH is
                # genuinely expanded, against a real installed env). So: a
                # relative path back to the test env root instead of any
                # PREFIX substitution at all. The test's own cwd is always
                # <test_run_env>/etc/conda/test-files/r-zig-slim/0 (fixed —
                # PKG_NAME is a constant "r-zig-slim", "0" is the single
                # test-script index rattler-build assigns), 5 levels below
                # <test_run_env>, so 5 `..` reaches Library/lib/R directly,
                # dialect-agnostic since it's plain relative path syntax.
                #
                # A real .R file, not inline `-e '...'`: cmd.exe has NO
                # concept of single quotes as a quoting mechanism — they're
                # just literal characters — so every cmd.exe metacharacter
                # inside the "quoted" R code (`%*%`'s `%`, `<-`'s `<`) was
                # being actively interpreted (`%...%` as variable expansion,
                # `<` as input redirection) rather than protected. Found by
                # inspecting the actual generated test/conda_build.bat
                # directly (its own content was correct — `Rscript -e
                # 'm <- matrix(...); ... %*% ...'`, verbatim from this
                # recipe) and reproducing the corruption independently at
                # cmd.exe's OWN runtime parsing stage, not YAML rendering.
                # bin/x64: the same hardcoded R_ARCH="x64" convention
                # build.zig's buildWindows() has throughout (bin/x64,
                # libs/x64, modules/x64, etc/x64) — see
                # feat-cross-platform-standardization/PLAN.md's explicit
                # win-arm64 non-goal. Fixing just this one literal without
                # also fixing build.zig's dozen would be cosmetic, not real
                # readiness; revisit together if win-arm64 is ever attempted.
                - 'echo PATHDEBUG=%PATH%'
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-win.R'
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-preflight.R'
              else:
                - $PREFIX/bin/Rscript -e 'set.seed(1); m <- matrix(rnorm(64),8,8); stopifnot(max(abs(solve(m) %*% m - diag(8))) < 1e-9); stopifnot(abs(det(qr.R(qr(m)))) > 0); stopifnot(max(Mod(fft(fft(1:8), inverse = TRUE) / 8 - 1:8)) < 1e-9); stopifnot(grepl("[0-9]+", "R 4", perl = TRUE), identical(memDecompress(memCompress("x")), charToRaw("x"))); caps <- capabilities(); stopifnot(caps[["cairo"]], caps[["png"]], caps[["ICU"]], caps[["iconv"]], caps[["libcurl"]], !caps[["X11"]], !caps[["aqua"]], !caps[["tcltk"]], !caps[["jpeg"]], !caps[["tiff"]], !caps[["NLS"]]); cat("conda R OK\n")'
                - $PREFIX/bin/Rscript test-preflight.R
        files:
          recipe:
            - test-win.R
            - test-preflight.R


  - package:
      name: r-zig-toolchain
    # Without the staging host's run exports (cairo, icu, libcurl, ...):
    # this package only adds compilers; R's libraries come with r-zig-slim.
    inherit:
      from: r-zig-build
      run_exports: false
    build:
      files:
        - lib/R/bin/toolchain/**
        - Library/lib/R/bin/toolchain/**
    requirements:
      run:
        # exactly the R build whose Makeconf names this directory
        - ${{ pin_subpackage("r-zig-slim", exact=True) }}
        - if: win
          then:
            # bash.exe: packages' own configure scripts and make's recipe
            # shell. (Until rzig, gcc.exe/g++.exe also ran the zig-cc shim
            # through it; m2-bash was build:-only until a real
            # `install.packages()` failure, glue/cli probing `cc --version`,
            # showed every compile failing in a freshly installed env.)
            - m2-bash
            # sed/grep/gawk/coreutils/make/which/find: real CRAN packages' own
            # `configure` scripts (autoconf-generated, arbitrary — not
            # something this project controls) lean on these heavily; m2-bash
            # alone only gets the shell *interpreter* present, not the tools
            # the script's own body calls. Found via a real, reproduced
            # `install.packages("pak")` failure on a freshly-installed
            # package: `./configure: line 62: sed: command not found` —
            # `sed.exe` genuinely didn't exist anywhere in the installed env
            # (these were build:-only, same gap m2-bash had). `make` also
            # needed here, separately from build:'s own `make >=4.4` below —
            # `R CMD SHLIB`/`INSTALL` shells out to it to actually drive
            # compilation for any package with a Makevars or multiple source
            # files, not just packages with a configure script.
            # texinfo/diffutils/tar/gzip/unzip/zip stay build:-only —
            # documentation-generation and archive tools a package's own
            # `configure`/compile step essentially never needs; add if a real
            # failure ever proves otherwise, same discipline as everything
            # else in this list.
            - m2-sed
            - m2-grep
            - m2-gawk
            - m2-coreutils
            - m2-make
            - m2-which
            - m2-findutils
        # package compilation works out of the box: Makeconf records the
        # bundled compiler front (rzig, R_HOME/bin/toolchain); these provide
        # the actual compilers. The Fortran
        # compiler must be the one R itself was built with (CRAN's own rule —
        # module files and runtime ABI differ between Fortran compilers), so
        # this mirrors the build exactly. flang-zig's closure is ~1.5 GiB
        # (flang-zig + lld-zig + flang-rt-zig), the accepted cost of one
        # Fortran toolchain everywhere (on osx-arm64, of correct complex
        # LAPACK at -O2; flang-pixi docs/11). Pinned as in build, so a
        # user gets the zig 0.16 flang this was built and tested with, not
        # a later 0.17 build.
        - zig 0.16.*
        - flang-zig ==23.1.1 *_6
        - lld-zig ==23.1.1 *_5
        - flang-rt-zig ==23.1.1 *_10
        - make >=4.4
    tests:
      - script:
          content:
            - if: win
              then:
                - '%PREFIX%/Library/lib/R/bin/x64/Rscript.exe test-toolchain.R'
              else:
                - $PREFIX/bin/Rscript test-toolchain.R
        files:
          recipe:
            - test-toolchain.R
    about:
      summary: Compilers for r-zig-slim (zig, flang, make and R_HOME/bin/toolchain's compiler front)

about:
  homepage: https://www.r-project.org
  license: GPL-2.0-or-later
  summary: R built with the zig toolchain (headless slim profile)
