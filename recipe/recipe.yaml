context:
  version: "4.6.1"

package:
  name: r-zig-slim
  version: ${{ version }}

source:
  # R sources from CRAN plus this repo's build scripts/toolchain shims —
  # the recipe is a consumer of the same scripts pixi tasks use.
  - url: https://cran.r-project.org/src/base/R-4/R-${{ version }}.tar.gz
    sha256: 4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
    target_directory: R-src
  - path: ../scripts
    target_directory: scripts
  - path: ../toolchain
    target_directory: toolchain

build:
  number: 0
  script: build.sh

requirements:
  build:
    - zig 0.16.*
    # Fortran: flang where conda-forge ships a matching-ABI build
    # (linux-64), explicit gfortran elsewhere — same split as pixi.toml.
    - if: linux64
      then:
        - flang
        - flang-rt_linux-64
    - if: osx or win
      then:
        - gfortran
    - make >=4.4
    - pkg-config
    - if: linux
      then:
        - patchelf
    - if: unix
      then:
        - bash
        - coreutils
        - sed
        - grep
        - gawk
        - which
        # unzip: build.zig shells out to it directly for share/zoneinfo
        # (zoneinfo.zip); gzip: grDevices' afm compression; tar/zip: not
        # invoked by the R build itself but kept for parity with pixi.
        # toml's own [target.unix.dependencies] set this recipe otherwise
        # mirrors — real gap found via a real `pixi run -e pkg
        # conda-package` run ("failed to spawn ... unzip: FileNotFound"),
        # since the old autoconf path apparently never needed them in the
        # rattler-build sandbox specifically (or was never exercised there).
        - unzip
        - gzip
        - tar
        - zip
    # gnuwin32 has no `configure`/autoconf step, so none of the unix
    # GNU-text-tool deps above apply — instead it needs the msys
    # userland to run at all (native make can't spawn the extensionless
    # zig shim scripts) plus uutils for the coreutils build.sh itself
    # uses. m2-bash is also what runs *this* build.sh in the first place
    # (rattler-build has no bld.bat here, same as conda-build convention).
    - if: win
      then:
        - uutils-coreutils
        - m2-bash
        - m2-make
        - m2-coreutils
        - m2-diffutils
        - m2-findutils
        - m2-texinfo
        - m2-which
        - m2-tar
        - m2-gzip
        - m2-sed
        - m2-grep
        - m2-gawk
        - m2-unzip
        - m2-zip
  host:
    # `which`: also needed here, not just build: — build.zig bakes an
    # absolute "$CONDA_PREFIX/bin/which" path into R's own Sys.which()
    # fallback (the @WHICH@ subst-table entry, substituted from whatever
    # $CONDA_PREFIX/ctx.conda resolves to at build time), and recipe/
    # build.sh points $CONDA_PREFIX at $PREFIX (host), not $BUILD_PREFIX —
    # unlike the old autoconf path, which found `which` via a plain $PATH
    # search (which already includes both build_env and host_env bins in
    # a rattler-build script), this vendored-config-replay design needs
    # the tool to exist at the SAME prefix its own path substitution
    # points at. Found via a real `pixi run -e pkg conda-package` run:
    # bootstrap's very first `library(utils)` load failed with ".onLoad
    # failed ... error in running command" — traced to Sys.which() calling
    # a `which` binary that didn't exist under $PREFIX/bin at all (only
    # under $BUILD_PREFIX/bin, a plain build: dependency). stage.sh's own
    # `bin/toolchain/which` rewrite (see TODO.md's gotcha catalog) fixes
    # this up for the FINAL installed package; this fixes the bootstrap
    # phase itself, before stage.sh has run. Unix-only: this @WHICH@
    # subst-table mechanism is part of installStaticTree/mkRbase, which
    # buildWindows() doesn't use at all (no bin/R front script on Windows,
    # per F6.0 — Rscript.exe is the only front-end there).
    # `sed`: same exact bug, confirmed by a real failure one step later
    # ("$PREFIX/bin/sed: No such file or directory" from bin/R's own
    # @SED@-substituted SED= line, R.sh.in's front-end argument parser).
    # `grep`: not yet hit by a real failure, but SED's sibling GREP/EGREP/
    # FGREP subst entries use the identical "@ZR_CONDA@/bin/grep[-flags]"
    # pattern — added proactively rather than waiting for the next
    # whack-a-mole round trip; AWK is a bare "gawk" (PATH-resolved, no
    # baked absolute path) so it isn't part of this class of bug.
    - if: unix
      then:
        - which
        - sed
        - grep
    # Fortran runtime: linked into libR, must be in host too
    - if: linux64
      then:
        - flang-rt_linux-64
    - if: osx or win
      then:
        - gfortran
    - zlib
    - bzip2
    - xz
    - liblzma-devel
    - pcre2
    - libcurl
    - icu
    - tzdata
    - libdeflate
    - llvm-openmp
    - cairo
    - expat
    - pango
    - fontconfig
    - freetype
    - libpng
    - glib
    # pango/cairo only pull in libharfbuzz (the runtime .so) as their own
    # transitive run dependency, not the headers — the vendored
    # CAIRO_CPPFLAGS build.zig applies unconditionally references
    # <include>/harfbuzz/hb.h directly (pango-coverage.h's own #include),
    # a real gap only surfaced once zig-build.sh started compiling the
    # cairo module unconditionally in the rattler-build sandbox (found via
    # a real "'hb.h' file not found" error, verified with a real `pixi run
    # -e pkg conda-package` run) — the equivalent pixi.toml dev env never
    # hit this because something else in its much larger dependency graph
    # happens to pull the headers package in transitively too. Build-time
    # only: end users don't need hb.h, and libharfbuzz.so is already
    # pulled in at runtime via pango's own run dependency.
    - harfbuzz
    # conda-forge's linux cairo needs xorg proto headers even though R
    # builds --with-x=no (pkg-config chain, not an actual X11 dep)
    - if: linux
      then:
        - xorg-xorgproto
    # discovered via `ldd`/`otool -L` on the actual built bin/exec/R +
    # libR — the full runtime closure, not just pixi.toml's direct deps
    - if: linux
      then:
        - zstd
        - libiconv
        - libstdcxx
        - libgcc
    - if: osx
      then:
        - libiconv
    # gnuwin32 has no capability off-switches (unlike unix's
    # --without-jpeglib etc.), so Windows R unconditionally links the
    # jpeg/tiff bitmap devices, the tcltk package, and NLS — these are
    # genuinely linked-at-runtime deps here, not just build inputs
    - if: win
      then:
        - libjpeg-turbo
        - libtiff
        - tk
        - gettext
  run:
    # R's own shared libraries (libR, base packages like stats/utils via
    # pcre2/icu, cairo devices, ...) are runtime-loaded — every *runtime*
    # lib from host: must be repeated here, or R fails to initialize in a
    # freshly solved env (host: alone is build-time only). xorg-xorgproto
    # and liblzma-devel are headers-only (pkg-config/build inputs),
    # intentionally omitted here.
    - zlib
    - bzip2
    - xz
    - pcre2
    - libcurl
    - icu
    - tzdata
    - libdeflate
    - llvm-openmp
    - cairo
    - expat
    - pango
    - fontconfig
    - freetype
    - libpng
    - glib
    - if: linux
      then:
        - zstd
        - libiconv
        - libstdcxx
        - libgcc
    - if: osx
      then:
        - libiconv
    - if: win
      then:
        - libjpeg-turbo
        - libtiff
        - tk
        - gettext
    # package compilation works out of the box: Makeconf records the
    # bundled zig shims; these provide the actual compilers
    - zig 0.16.*
    - if: linux64
      then:
        - flang
        - flang-rt_linux-64
    - if: osx or win
      then:
        - gfortran
    - make >=4.4

tests:
  # Mirrors scripts/smoke-test.sh's actual assertions (numerics: LAPACK
  # solve/qr, BLAS matmul, fft round-trip; pcre2 regex; zlib compression;
  # the slim capability profile) rather than a stripped-down subset — a
  # conda package is a distribution artifact, and this is the one check
  # that runs in a truly isolated env (no dev pixi env masking a gap).
  # Windows keeps smoke-test.sh's own relaxed set: gnuwin32 has no slim/
  # full off-switches, so tcltk/jpeg/tiff/NLS are TRUE despite this being
  # r-zig-slim — asserting them FALSE here would be a false expectation,
  # not a real regression check.
  - script:
      - if: win
        then:
          # Bare `Rscript` (not the absolute path) deliberately — this is
          # the one check that actually exercises PATH-based invocation,
          # which is what real installs use. Found the hard way: R used
          # to install under $PREFIX/lib/R, which NTFS's case-insensitive
          # lookup silently folds into a real env's existing Lib/
          # (Python's), and nothing was ever on PATH regardless — the
          # absolute-path version of this test couldn't have caught
          # either bug. See env.sh's R_HOME_DIR / stage.sh's Windows
          # shims (Library/bin/R.bat, Rscript.bat).
          - echo PATHDEBUG=%PATH%
          - Rscript -e 'set.seed(1); m <- matrix(rnorm(64),8,8); stopifnot(max(abs(solve(m) %*% m - diag(8))) < 1e-9); stopifnot(abs(det(qr.R(qr(m)))) > 0); stopifnot(max(Mod(fft(fft(1:8), inverse = TRUE) / 8 - 1:8)) < 1e-9); stopifnot(grepl("[0-9]+", "R 4", perl = TRUE), identical(memDecompress(memCompress("x")), charToRaw("x"))); caps <- capabilities(); stopifnot(caps[["png"]], caps[["iconv"]], caps[["libcurl"]], caps[["cairo"]]); cat("conda R OK\n")'
        else:
          - $PREFIX/bin/Rscript -e 'set.seed(1); m <- matrix(rnorm(64),8,8); stopifnot(max(abs(solve(m) %*% m - diag(8))) < 1e-9); stopifnot(abs(det(qr.R(qr(m)))) > 0); stopifnot(max(Mod(fft(fft(1:8), inverse = TRUE) / 8 - 1:8)) < 1e-9); stopifnot(grepl("[0-9]+", "R 4", perl = TRUE), identical(memDecompress(memCompress("x")), charToRaw("x"))); caps <- capabilities(); stopifnot(caps[["cairo"]], caps[["png"]], caps[["ICU"]], caps[["iconv"]], caps[["libcurl"]], !caps[["X11"]], !caps[["aqua"]], !caps[["tcltk"]], !caps[["jpeg"]], !caps[["tiff"]], !caps[["NLS"]]); cat("conda R OK\n")'

about:
  homepage: https://www.r-project.org
  license: GPL-2.0-or-later
  summary: R built with the zig toolchain (headless slim profile)
